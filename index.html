<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Smart Astro Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="astronomy.browser.min.js?v=2.1.19"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0a0a1a;--card:#111128;--accent:#4a9eff;--text:#e0e0e0;--text-dim:#888;
--exc:#2ecc71;--gd:#3498db;--mgn:#e67e22;--none:#555;
--easy:#2ecc71;--moderate:#e67e22;--challenging:#e74c3c;--extreme:#8e44ad;
--radius:12px;--gap:12px;
}
html{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
body{background:var(--bg);min-height:100vh;min-height:100dvh;padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:70px;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);overflow-x:hidden}
input,select,textarea,button{font-size:16px;font-family:inherit}
input,select,textarea{background:#1a1a3a;color:var(--text);border:1px solid #333;border-radius:8px;padding:10px 12px;width:100%;max-width:100%;outline:none;box-sizing:border-box}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
button{cursor:pointer;border:none;border-radius:8px;padding:10px 16px;font-weight:600;transition:opacity .2s}
button:active{opacity:.7}
.btn-primary{background:var(--accent);color:#fff;transition:background-color .15s}
.btn-secondary{background:#2a2a4a;color:var(--text);transition:background-color .15s}
.btn-danger{background:#e74c3c;color:#fff;transition:background-color .15s}
.device-desktop .btn-primary:hover{background:#3a8eef}
.device-desktop .btn-secondary:hover{background:#34345a}
.device-desktop .btn-danger:hover{background:#ef5c4d}
.btn-sm{padding:6px 12px;font-size:14px}

/* Nav */
nav{position:fixed;bottom:0;left:0;right:0;background:#0d0d24;border-top:1px solid #222;display:flex;z-index:45;padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
nav button{flex:1;background:none;color:var(--text-dim);padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;border-radius:0}
nav button.active{color:var(--accent)}
nav button svg{width:22px;height:22px;fill:currentColor}

/* Tabs */
.tab{display:none;padding:16px;max-width:900px;margin:0 auto}
.tab.active{display:block}
#tab-targets.active{display:flex;flex-direction:column;height:calc(100vh - 70px);padding:0;overflow:hidden}
.targets-header{flex:0 0 auto;padding:16px 16px 12px;max-width:900px;width:100%;margin:0 auto;border-bottom:1px solid #222}
.targets-body{flex:1 1 0;overflow-y:auto;padding:0 16px 16px;max-width:900px;width:100%;margin:0 auto}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:var(--gap)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.card-title{font-weight:700;font-size:16px}

/* Badges */
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;text-transform:uppercase}
.badge-exc{background:var(--exc);color:#000}
.badge-gd{background:var(--gd);color:#fff}
.badge-mgn{background:var(--mgn);color:#fff}
.badge-none{background:var(--none);color:#ccc}
.badge-active{background:var(--accent);color:#fff}
.badge-easy{background:var(--easy);color:#000}
.badge-moderate{background:var(--moderate);color:#fff}
.badge-challenging{background:var(--challenging);color:#fff}
.badge-extreme{background:var(--extreme);color:#fff}

/* Form layout */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:4px;font-weight:600}
.form-row{display:flex;gap:10px}
.form-row>*{flex:1;min-width:0}
.form-section{border:1px solid #1c2c4a;border-radius:12px;padding:14px;margin:16px 0}
.form-section h3{color:var(--accent);margin:0 0 12px;font-size:14px;display:flex;align-items:center;gap:6px}
.form-section .form-group:last-child,.form-section .form-row:last-child{margin-bottom:0}

/* Slider */
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.slider-row label{flex:0 0 140px;font-size:13px}
.slider-row input[type=range]{flex:1;accent-color:var(--accent)}
.slider-row .val{flex:0 0 24px;text-align:right;font-size:13px;color:var(--accent)}

/* Segmented */
.segmented{display:flex;gap:0;border-radius:8px;overflow:hidden;border:1px solid #333}
.segmented button{flex:1;border-radius:0;background:#1a1a3a;color:var(--text-dim);padding:8px;font-size:13px}
.segmented button.active{background:var(--accent);color:#fff}

/* Visibility table */
.vis-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
.vis-table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.vis-table th,.vis-table td{padding:8px 8px;text-align:center;white-space:nowrap}
.vis-table thead th{color:var(--accent);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;background:#111128;border-bottom:2px solid #2a4a7a;z-index:2;padding:10px 8px}
.vis-table .target-name{text-align:left;position:sticky;left:0;z-index:1;white-space:nowrap}
.vis-table thead .target-name{z-index:3}
.vis-table tbody tr{cursor:pointer;transition:background .15s;border-bottom:1px solid #1a1a3a}
.vis-table tbody tr:nth-child(even){background:rgba(26,26,58,0.3)}
.vis-table tbody tr:hover{background:#1a2a4a;outline:1px solid #2a4a7a;outline-offset:-1px}
.vis-table tbody tr:active{background:#1a1a3a}
.vis-table tbody td.target-name{background:inherit}
.vis-table .target-sub{display:block;font-size:10px;font-weight:400;color:var(--text-dim);margin-top:1px}

/* Framing navigation */
.framing-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.1);border:none;color:#ccc;font-size:20px;padding:4px 8px;border-radius:4px;cursor:pointer;z-index:2}
.framing-nav:hover{background:rgba(255,255,255,0.2)}
.framing-nav-left{left:4px}
.framing-nav-right{right:4px}
.device-phone .framing-nav,.device-tablet .framing-nav{display:none}

/* Detail screen */
.detail-content-inner{max-width:800px;margin:0 auto}
.detail-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:90;display:none}
.detail-screen.open{display:block}
.detail-header{position:absolute;top:env(safe-area-inset-top);left:0;right:0;height:50px;background:var(--bg);z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 16px;padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right));border-bottom:1px solid #222}
.detail-content{position:absolute;top:calc(50px + env(safe-area-inset-top));left:0;right:0;bottom:0;overflow-y:auto;padding:16px;padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right));padding-bottom:80px}
.detail-back{background:none;color:var(--accent);padding:8px 0;font-size:15px;display:flex;align-items:center;gap:4px}

/* Floating action */
.fab{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:12px 24px;border-radius:28px;font-weight:700;font-size:15px;z-index:50;box-shadow:0 4px 20px rgba(74,158,255,.4);display:none}
.fab.visible{display:block}

/* Modal / Full screen */
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:95;overflow-y:auto;overflow-x:hidden;padding:16px;padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:80px;padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right));display:none}
.modal.open{display:block}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-size:20px;font-weight:700}
.modal-close{background:none;color:var(--text-dim);font-size:24px;padding:4px 8px}

/* Plan rendered content */
.plan-content h1{color:var(--accent);font-size:20px;border-bottom:2px solid var(--accent);padding-bottom:6px;margin:20px 0 12px}
.plan-content h2{color:var(--accent);font-size:17px;margin:16px 0 8px}
.plan-content h3{color:#7bb8ff;font-size:15px;margin:12px 0 6px}
.plan-content p{margin:6px 0;line-height:1.5}
.plan-content strong{color:#fff}
.plan-content blockquote{border-left:3px solid var(--mgn);background:#1a1510;color:#e6a950;padding:8px 12px;margin:8px 0;border-radius:0 8px 8px 0}
.plan-content table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px;display:block;overflow-x:auto}
.plan-content th{background:#1a1a3a;color:var(--accent);padding:6px 8px;text-align:left}
.plan-content td{padding:6px 8px;border-bottom:1px solid #1a1a3a}
.plan-content tr:nth-child(even){background:#0f0f25}
.plan-content hr{border:none;border-top:1px solid #333;margin:16px 0}
.plan-content ul{padding-left:20px;margin:6px 0}
.plan-content li{margin:3px 0;line-height:1.4}
.plan-content .filter-ha{color:#e74c3c;font-weight:700}
.plan-content .filter-oiii{color:#3498db;font-weight:700}
.plan-content .filter-sii{color:#e67e22;font-weight:700}
.plan-content .filter-l{color:#ddd;font-weight:700}
.plan-content .filter-r{color:#e74c3c;font-weight:700}
.plan-content .filter-g{color:#2ecc71;font-weight:700}
.plan-content .filter-b{color:#3498db;font-weight:700}
.plan-content .ops-note{color:#888;font-style:italic}

/* Misc */
.empty-state{text-align:center;color:var(--text-dim);padding:40px 16px}
.empty-state svg{width:48px;height:48px;fill:var(--text-dim);margin-bottom:12px}
.loading{text-align:center;padding:40px}
.loading::after{content:'';display:inline-block;width:28px;height:28px;border:3px solid #333;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#2a2a4a;color:var(--text);padding:10px 20px;border-radius:8px;z-index:200;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.toggle-pass{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;color:var(--text-dim);font-size:12px;padding:4px 8px}

/* Wiki section */
.wiki-thumb{width:100%;max-width:300px;border-radius:8px;margin:8px 0}
.wiki-extract{font-size:14px;line-height:1.5;color:var(--text-dim)}

/* Target pill */
.target-pill{display:inline-block;padding:4px 10px;border-radius:16px;background:#1a1a3a;color:var(--text);font-weight:600;font-size:13px;transition:background .2s,color .2s;cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.target-pill.selected{background:var(--accent);color:#fff}

/* Selection checkbox — desktop only */
.row-check{width:18px;height:18px;border:2px solid #555;border-radius:4px;display:none;align-items:center;justify-content:center;flex-shrink:0;margin-left:6px;transition:all .15s;cursor:pointer;vertical-align:middle}
.row-check.checked{background:var(--accent);border-color:var(--accent)}
.row-check.checked::after{content:'✓';color:#fff;font-size:12px;font-weight:700}
.device-desktop .row-check{display:inline-flex}
.star-toggle{display:inline-block;font-size:16px;color:#666;cursor:pointer;margin-right:6px;vertical-align:middle;line-height:1}
.star-toggle.active{color:#f1c40f}

.target-legend{margin-top:12px;font-size:11px;color:var(--text-dim);display:flex;flex-direction:column;gap:4px}
.target-legend div{display:flex;gap:8px;flex-wrap:nowrap;align-items:center}
.target-legend strong{color:var(--text)}
.device-phone .target-legend{font-size:10px}
.device-phone .target-legend div{gap:5px}
.mobile-targets{display:none}
.mobile-target-card,.device-phone .saved-list-card,.device-tablet .saved-list-card{cursor:pointer;border:1px solid #2a4a7a;border-radius:8px}
.device-phone #target-detail .card,.device-tablet #target-detail .card{border:1px solid #2a4a7a}
.device-desktop #target-detail .card{border:1px solid #1c2c4a;transition:border-color .15s,transform .15s,box-shadow .15s}
.device-desktop #target-detail .card:hover{border-color:#3a6ab0;box-shadow:0 4px 16px rgba(74,158,255,.12);transform:translateY(-1px)}
.device-desktop #target-detail .card-title{color:var(--accent)}
.device-phone #tab-equipment .card,.device-tablet #tab-equipment .card,.device-phone #tab-locations .card,.device-tablet #tab-locations .card{border:1px solid #2a4a7a}
.device-desktop #tab-equipment .card,.device-desktop #tab-locations .card{border:1px solid #1c2c4a;transition:border-color .15s,transform .15s,box-shadow .15s}
.device-desktop #tab-equipment .eq-loc-card:hover,.device-desktop #tab-locations .eq-loc-card:hover{border-color:#3a6ab0;box-shadow:0 4px 16px rgba(74,158,255,.12);transform:translateY(-1px)}
.eq-loc-card.active-card{border-color:var(--accent)!important}
.stat-chip{display:inline-block;font-size:11px;font-weight:600;color:var(--text-dim);background:#1a1a3a;padding:3px 9px;border-radius:10px}
.settings-card{border:1px solid #1c2c4a}
.device-desktop #tab-equipment .eq-loc-card .card-title,.device-desktop #tab-locations .eq-loc-card .card-title{color:var(--accent)}
.wk-phone{display:none}
.wk-tablet{display:none}
.date-picker-desktop{display:block}.date-picker-mobile{display:none}
.device-phone .date-picker-desktop,.device-tablet .date-picker-desktop{display:none}
.device-phone .date-picker-mobile,.device-tablet .date-picker-mobile{display:flex}
.device-phone .wk-phone{display:block}
@media (orientation:landscape){.device-phone .phone-header-portrait{display:none!important}.device-phone .phone-header-landscape{display:flex!important}}
.device-phone .wk-tablet{display:none}
.device-tablet .wk-phone{display:none}
.device-tablet .wk-tablet{display:block}
.device-phone .vis-table-wrap,.device-tablet .vis-table-wrap{display:none}
.device-phone .mobile-targets,.device-tablet .mobile-targets{display:block}
.device-phone .detail-vis-desktop,.device-tablet .detail-vis-desktop{display:none!important}
.device-phone .detail-vis-mobile,.device-tablet .detail-vis-mobile{display:block!important}
.device-desktop .vis-table{font-size:13px}
@media print{
  body{background:#fff!important;color:#222!important;padding:0!important}
  nav,.fab,.no-print,.empty-state,#fab-generate{display:none!important}
  .tab{display:none!important}
  #tab-plan{display:block!important;padding:0!important}
  #tab-plan>h3,#tab-plan>.card:not(:first-child){display:none!important}
  .card-header{margin-bottom:8px}
  .card-title{color:#000!important;font-size:18px}
  .plan-content{color:#222!important}
  .plan-content h1{color:#1a5ab8!important;border-bottom-color:#ccc!important}
  .plan-content h2{color:#1a5ab8!important}
  .plan-content h3{color:#2a6ac8!important}
  .plan-content strong{color:#000!important}
  .plan-content blockquote{border-left-color:#e67e22!important;background:#fff8e1!important;color:#795600!important}
  .plan-content table{border:1px solid #ccc}
  .plan-content th{background:#eee!important;color:#222!important;border-bottom:2px solid #999}
  .plan-content td{border-bottom:1px solid #ddd!important;color:#222!important}
  .plan-content tr:nth-child(even){background:#f5f5f5!important}
  .plan-content .filter-ha{color:#c0392b!important}
  .plan-content .filter-oiii{color:#2471a3!important}
  .plan-content .filter-sii{color:#b7600a!important}
  .plan-content .filter-l{color:#333!important}
  .plan-content .filter-r{color:#c0392b!important}
  .plan-content .filter-g{color:#1e8449!important}
  .plan-content .filter-b{color:#2471a3!important}
  .plan-content .ops-note{color:#666!important}
  .plan-content table,.plan-content blockquote,.plan-content h2,.plan-content h3{page-break-inside:avoid}
  .badge-exc{background:#27ae60!important;color:#fff!important}
  .badge-gd{background:#2980b9!important;color:#fff!important}
  .badge-mgn{background:#d35400!important;color:#fff!important}
  .badge-none{background:#999!important;color:#fff!important}
  .card{background:none!important;border:none!important;padding:0!important}
  @page{margin:15mm;@bottom-center{content:"Smart Astro Planner — " attr(data-date)}}
  body::after{content:"Smart Astro Planner — Printed " attr(data-date);position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:10px;color:#999;padding:8px}
}
/* ── Meridian tab ── */
#tab-meridian{padding:16px;max-width:700px;margin:0 auto;overflow-y:auto}
.meridian-card{margin-bottom:14px}
.meridian-transit{font-size:26px;font-weight:700;color:var(--accent);letter-spacing:.5px;line-height:1}
.meridian-remain{font-size:26px;font-weight:700;line-height:1}
.meridian-remain.future{color:#2ecc71}
.meridian-remain.recent{color:#e67e22}
.meridian-remain.past{color:#888}
.help-btn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#1a2a4a;color:#7cc4ff;border:1px solid #2a4a7a;font-size:11px;font-weight:700;cursor:pointer;margin-left:6px;vertical-align:middle;padding:0;line-height:1}
.help-btn:hover{background:#2a4a7a}
.help-popup-body h2{font-size:17px;font-weight:700;color:#4a9eff;margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid #1a1a35}
.help-popup-body h3{font-size:14px;font-weight:600;color:#88aaff;margin:18px 0 6px}
.help-popup-body p{font-size:14px;color:#c0c0d8;margin-bottom:10px;line-height:1.6}
.help-popup-body p b{color:#e0e0f0}
.help-popup-body p i{color:#888aaa}
.help-popup-body ul{padding-left:20px;margin:6px 0 10px}
.help-popup-body ul li{font-size:14px;color:#c0c0d8;margin-bottom:4px;line-height:1.5}
.help-popup-body ul li b{color:#e0e0f0}
.help-popup-body .note{font-size:13px;color:#888aaa;font-style:italic;padding:8px 12px;border-left:3px solid #333366;background:#0d0d22;border-radius:0 6px 6px 0;margin:8px 0 12px}
.help-popup-body .mode-table,.help-popup-body .vis-table{width:100%;border-collapse:collapse;margin:12px 0 16px;font-size:13px}
.help-popup-body .mode-table th,.help-popup-body .vis-table th{background:#111128;color:#4a9eff;padding:8px 12px;text-align:left;border:1px solid #1a2040}
.help-popup-body .mode-table td,.help-popup-body .vis-table td{padding:8px 12px;border:1px solid #1a2040;color:#c0c0d8;vertical-align:top}
.help-popup-body .mode-table tr:nth-child(even) td{background:#0d0d20}
.help-popup-body .badge-exc{display:inline-block;background:#0F6E56;color:#E1F5EE;border-radius:4px;padding:1px 7px;font-size:12px;font-weight:600}
.help-popup-body .badge-gd{display:inline-block;background:#185FA5;color:#E6F1FB;border-radius:4px;padding:1px 7px;font-size:12px;font-weight:600}
.help-popup-body .badge-mgn{display:inline-block;background:#854F0B;color:#FAEEDA;border-radius:4px;padding:1px 7px;font-size:12px;font-weight:600}
.help-popup-body figure{margin:14px 0 18px}
.help-popup-body figure img{display:block;width:100%;height:auto;border-radius:8px;border:1px solid #1a2040}
.help-popup-body figcaption{font-size:12px;color:#888aaa;margin-top:6px;line-height:1.45}
</style>
</head>
<body>

<!-- TABS -->
<div id="tab-targets" class="tab active">
  <div id="targets-header" class="targets-header"></div>
  <div id="targets-body" class="targets-body"></div>
</div>
<div id="tab-plan" class="tab"></div>
<div id="tab-equipment" class="tab"></div>
<div id="tab-locations" class="tab"></div>
<div id="tab-meridian" class="tab"></div>
<div id="tab-settings" class="tab"></div>
<div id="tab-help" class="tab"><div style="margin-bottom:10px"><button class="btn-sm btn-secondary" onclick="window.open('help.html','_blank')">Open in browser</button></div><iframe id="help-frame" style="display:none;width:100%;height:calc(100vh - 150px);border:none;border-radius:12px"></iframe><div id="help-loading" class="empty-state"><p>Loading help...</p></div></div>

<button id="ask-ai-fab" onclick="openAskAi()" title="Ask AI" style="position:fixed;right:16px;bottom:76px;z-index:50;width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:20px;box-shadow:0 2px 10px rgba(0,0,0,.4);cursor:pointer">❓</button>
<!-- Bottom Nav -->
<nav>
<button class="active" onclick="switchTab('targets',this)">
<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>
Targets</button>

const TARGET_TYPE_ORDER = ['Emission Nebula','SNR','IFN','Reflection Nebula','Planetary Nebula','Galaxy','Open Cluster','Globular Cluster','Dark Nebula'];
function sortTargetsForList(targets) {
  return [...targets].sort((a,b) => {
    const ia = TARGET_TYPE_ORDER.indexOf(a.type), ib = TARGET_TYPE_ORDER.indexOf(b.type);
    if (ia !== ib) return (ia===-1?99:ia) - (ib===-1?99:ib);
    return (a.name||a.catalog).localeCompare(b.name||b.catalog);
  });
}

function calcFOV(eq) {
  if (!eq) return {w:0,h:0,ps:0};
  const efl = eq.telescope.focal_length*(eq.telescope.reducer??1);
  const w = 2*Math.atan(eq.sensor.width_mm/(2*efl))*(180/Math.PI);
  const h = 2*Math.atan(eq.sensor.height_mm/(2*efl))*(180/Math.PI);
  const ps = (eq.sensor.pixel_size_um/efl)*206.265;
  return {w:+w.toFixed(3),h:+h.toFixed(3),ps:+ps.toFixed(2)};
}

      <div><strong>Cederblad (VII/231)</strong> — Bright diffuse nebulae (Sven Cederblad, 1946)</div>
      <div><strong>RCW (VII/216)</strong> — Southern HII regions (Rodgers, Campbell & Whiteoak, 1960)</div>

      <div><strong>LDN (VII/7A)</strong> — Dark nebulae (Beverly Lynds, 1962)</div>

function typeAbbr(type) {
  const m = {'Emission Nebula':'Em','SNR':'SNR','IFN':'IFN','Reflection Nebula':'Ref','Planetary Nebula':'PN','Galaxy':'Gal','Open Cluster':'OC','Globular Cluster':'GC','Dark Nebula':'Dk'};
  return m[type]||type;
}

function normalizeVis(v) {
  if (!v) return '—';
  const l = v.toLowerCase().trim();
  if (l==='exc'||l==='excellent'||l==='★★★'||l==='***') return 'EXC';
  if (l==='gd'||l==='good'||l==='★★'||l==='**') return 'GD';
  if (l==='mgn'||l==='marginal'||l==='fair'||l==='★'||l==='*') return 'MGN';
  return '—';
}

function moonSensitivity(t) {
  const nb = ['Hα','Ha','OIII','SII'];
  const bb = ['L','R','G','B'];
  const filters = (t.filters||[]);
  if (['Reflection','IFN','Dark Nebula','Globular Cluster'].includes(t.type)) return 'full';
  const hasNB = filters.some(f=>nb.includes(f));
  const hasBB = filters.some(f=>bb.includes(f));
  if (hasNB && !hasBB) return 'none';
  if (hasBB && !hasNB) return 'full';
  if (hasNB && hasBB) return 'half';
  return 'full';
}

function moonIcon(sens, size=16) {
  if (sens==='none') return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="vertical-align:middle"><circle cx="12" cy="12" r="8" fill="none" stroke="#888" stroke-width="2"/><line x1="6" y1="6" x2="18" y2="18" stroke="#888" stroke-width="2"/></svg>`;
  if (sens==='half') return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="vertical-align:middle"><circle cx="12" cy="12" r="8" fill="none" stroke="#ccc" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="#ccc"/></svg>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="vertical-align:middle"><circle cx="12" cy="12" r="8" fill="#ccc" stroke="#ccc" stroke-width="1"/></svg>`;
}

function parseSizeUnit(val, unit) {
  const n = parseFloat(val);
  if (isNaN(n) || n <= 0) return 0;
  return unit === '°' ? n : n / 60;
}

function parseSize(s) {
  if (!s) return null;
  const clean = s.replace(/[~≈]/g, '').replace(/\([^)]*\)/g, '').trim();
  const dual = clean.match(/([\d.]+)\s*([°'′])\s*[×xX]\s*([\d.]+)\s*([°'′])/);
  if (dual) {
    const w = parseSizeUnit(dual[1], dual[2]);
    const h = parseSizeUnit(dual[3], dual[4]);
    return (w > 0 && h > 0) ? {w, h} : null;
  }
  const single = clean.match(/([\d.]+)\s*([°'′])/);
  if (single) {
    const v = parseSizeUnit(single[1], single[2]);
    return v > 0 ? {w: v, h: v} : null;
  }
  return null;
}

function visClass(v) {
  const n = normalizeVis(v);
  if (n==='EXC') return 'exc';
  if (n==='GD') return 'gd';
  if (n==='MGN') return 'mgn';
  return 'none';
}

function monthToWeeks(monthVis, startDate, numWeeks) {
  const weeks = [];
  const [sy,sm,sd] = (startDate||'').split('-').map(Number);
  if (!sy) return weeks;
  const cur = new Date(sy, sm-1, sd);
  const mn = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const n = numWeeks || 12;
  for (let wk = 1; wk <= n; wk++) {
    const mName = mn[cur.getMonth()];
    const label = `${mn[cur.getMonth()]} ${cur.getDate()}`;
    weeks.push({label, vis: monthVis[mName]||'—', wk});
    cur.setDate(cur.getDate()+7);
  }
  return weeks;
}

function todayLocal() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function calcEndDate(startStr, numWeeks) {
  const [y,m,d] = startStr.split('-').map(Number);
  const end = new Date(y, m-1, d + (numWeeks||12)*7);
  return `${end.getFullYear()}-${String(end.getMonth()+1).padStart(2,'0')}-${String(end.getDate()).padStart(2,'0')}`;
}

function dayOfYear(dateStr) {
  const [y,m,d] = dateStr.split('-').map(Number);
  return Math.floor((new Date(y,m-1,d) - new Date(y,0,0)) / 86400000);
}

// Best observing month ≈ when object transits at midnight (sun is 12h away in RA).
// Sun RA = 0 at vernal equinox (day 79 ≈ Mar 20), increases 24h over 365 days.
function objectBestDayOfYear(raHours) {
  const sunRaAtBest = (raHours + 12) % 24;
  return Math.round(((sunRaAtBest * 365 / 24) + 79) % 365);
}

function isInSeasonRange(bestDoy, startDateStr, numWeeks, graceDays = 14) {
  const lo = dayOfYear(startDateStr) - graceDays;
  const hi = dayOfYear(startDateStr) + numWeeks * 7 + graceDays;
  if (hi - lo >= 365) return true;
  const d = ((bestDoy - lo) % 365 + 365) % 365;
  return d <= (hi - lo);
}

function formatDateReadable(dateStr) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[m-1]} ${d}, ${y}`;
}

// ─── TARGETS TAB ────────────────────────────────────────────
function renderTargets() {
  const targets = getTargets();
  const meta = LS.get('sap_target_meta');
  const headerEl = document.getElementById('targets-header');
  const bodyEl = document.getElementById('targets-body');

  if (!targets.length) {
    headerEl.innerHTML = '';
    bodyEl.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" style="color:var(--text-dim)"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>
      <p>No target list yet</p>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:16px">
        <button class="btn-primary" onclick="openNewTargets()">New Target List</button>
      </div>
    </div>` + renderSavedLists();
    return;
  }

  const startDate = meta?.period_start || todayLocal();
  const nw = meta?.numWeeks || 12;

  function getWeeks(t) {
    if (t.weeklyVis) return t.weeklyVis;
    return monthToWeeks(t.visibility||{}, startDate, nw);
  }

  const headerWeeks = getWeeks(targets[0]);

  headerEl.innerHTML = `<div class="card-title">${meta?.name||'Target List'}</div>
    <span style="font-size:12px;color:var(--text-dim)">${targets.length} targets</span>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn-primary btn-sm" onclick="openNewTargets()">New Target List</button>
      <button class="btn-sm btn-secondary" onclick="archiveTargetList()">Archive</button>
    </div>`;

  let html = '';

  html += `<div class="vis-table-wrap"><table class="vis-table"><thead><tr>
    <th class="target-name">Target</th><th>Type</th>`;
  headerWeeks.forEach(w => html += `<th>${w.label}</th>`);
  html += `</tr></thead><tbody>`;

  const sorted = sortTargetsForList(targets);
  sortedTargetIds = sorted.map(t=>t.id);

  sorted.forEach(t => {
    const tWeeks = getWeeks(t);
    const displayName = t.name || t.catalog;
    const subName = t.name && t.name !== t.catalog ? `<span class="target-sub">${t.catalog}</span>` : '';
    html += `<tr data-tid="${t.id}" onclick="openTargetDetail('${t.id}')">
      <td class="target-name"><span class="target-pill" data-tid="${t.id}"
        onclick="event.stopPropagation();openTargetDetail('${t.id}')">${displayName}${subName}</span></td>
      <td style="font-size:11px;color:var(--text-dim);white-space:nowrap">${typeAbbr(t.type)}</td>`;
    tWeeks.forEach(w => {
      const cls = visClass(w.vis);
      const label = normalizeVis(w.vis);
      html += `<td><span class="badge badge-${cls}">${label}</span></td>`;
    });
    html += `</tr>`;
  });

  html += `</tbody></table></div>`;

  // Mobile card view
  html += `<div class="mobile-targets">`;
  sorted.forEach(t => {
    const tName = (t.name||t.catalog);
    const truncName = tName.length > 25 ? tName.slice(0,24)+'…' : tName;
    const tWeeks = getWeeks(t);
    const wkBadge = (w,fs,bs) => `<div style="flex:1;text-align:center"><div style="font-size:${fs};color:var(--text-dim);white-space:nowrap">${w.label}</div><span class="badge badge-${visClass(w.vis)}" style="font-size:${bs};padding:1px 3px">${normalizeVis(w.vis)}</span></div>`;
    html += `<div class="card mobile-target-card" onclick="openTargetDetail('${t.id}')">
      <div class="wk-phone">
        <div class="phone-header-portrait" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">

  html += `<div class="target-legend">

      <span><span class="badge badge-none">—</span></span>

  bodyEl.innerHTML = html;
}

function renderSavedLists() {
  const saved = LS.get('sap_saved_lists', []);
  if (!saved.length) return '';
  let html = `<h3 style="color:var(--text-dim);margin:20px 0 8px">Saved Lists</h3>`;
  saved.forEach(s => {
    html += `<div class="card saved-list-card" style="cursor:pointer" onclick="loadSavedList('${s.id}')">
      <div class="card-header"><div class="card-title" style="font-size:14px">${s.name}</div>
        <button class="btn-sm btn-danger" onclick="event.stopPropagation();deleteSavedList('${s.id}')">Delete</button></div>
      ${s.description?`<p style="font-size:12px;color:var(--text-dim);margin-bottom:4px">${s.description}</p>`:''}
      <p style="font-size:12px;color:var(--text-dim)">${new Date(s.saved).toLocaleDateString()} · ${s.count} targets</p>
    </div>`;
  });
  return html;
}

function archiveTargetList() {
  const targets = getTargets();
  const meta = LS.get('sap_target_meta');
  if (!targets.length) return;
  openNameModal('Archive Target List', (name, desc) => {
    const saved = LS.get('sap_saved_lists', []);
    saved.push({
      id: uuid(), name, description: desc, saved: new Date().toISOString(),
      count: targets.length, targets, meta
    });
    LS.set('sap_saved_lists', saved);
    toast('List archived');
    renderTargets();
  }, meta?.name || '');
}

function loadSavedList(id) {
  const saved = LS.get('sap_saved_lists', []);
  const s = saved.find(x => x.id === id);
  if (!s) return;
  LS.set('sap_targets', s.targets);
  LS.set('sap_target_meta', s.meta);
  toast('List loaded');
  renderTargets();
}

function deleteSavedList(id) {
  if (!confirm('Delete this saved list?')) return;
  LS.set('sap_saved_lists', LS.get('sap_saved_lists', []).filter(s => s.id !== id));
  renderTargets();
}

let pillTouchSX = 0, pillTouchSY = 0;
function pillTouchStart(e) {
  pillTouchSX = e.changedTouches[0].clientX;
  pillTouchSY = e.changedTouches[0].clientY;
}
function pillTouchEnd(e, tid) {
  const dx = e.changedTouches[0].clientX - pillTouchSX;
  const dy = e.changedTouches[0].clientY - pillTouchSY;
  if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
    openTargetDetail(tid);
  }
}

// ─── My Targets Tab ──────────────────────────────────────────
function addToMyTargets(tid) {
  const t = getTargets().find(x => x.id === tid);
  if (!t) return;
  const S = window._sky;
  const eq = window._detailEq;
  if (!S || !eq) { toast('Add equipment first'); return; }
  const now = new Date().toISOString();
  const id = uuid();
  const entry = {
    id, catalog: t.catalog, name: t.name, type: t.type,
    ra: S.ra, dec: S.dec, angle: S.angle,
    equipment_id: eq.id,
    location_id: getListLocation()?.id || null,
    filters: t.filters, size_arcmin: t.size_arcmin, size_min_arcmin: t.size_min_arcmin, pa: t.pa,
    status: 'todo', added_at: now, updated_at: now
  };
  const arr = getMyTargets();
  arr.unshift(entry);
  saveMyTargets(arr);
  // carry over an existing emission-line analysis for this catalog object, if any (still shown as stale if the frame differs)
  const lines = getLineAnalyses();
  const existing = lines[t.catalog || t.name];
  if (existing) { lines['mt:' + id] = existing; LS.set('sap_lines', lines); }
  toast('Added to My Targets');
  const hint = document.getElementById('mt-hint');
  if (hint) {
    const n = getMyTargets().filter(m => m.catalog === t.catalog).length;
    hint.textContent = `${n} framing${n>1?'s':''} already saved`;
  }
}

function deleteMyTarget(id) {
  if (!confirm('Remove this framing from My Targets?')) return;
  saveMyTargets(getMyTargets().filter(m => m.id !== id));
  const lines = getLineAnalyses();
  if (lines['mt:' + id]) { delete lines['mt:' + id]; LS.set('sap_lines', lines); }
  closeTargetDetail();
  renderMyTargets();
}

function setMyTargetStatus(id, btn, status) {
  const arr = getMyTargets();
  const mt = arr.find(m => m.id === id);
  if (!mt) return;
  mt.status = status; mt.updated_at = new Date().toISOString();
  saveMyTargets(arr);
  if (btn) { btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
}

// Resolves the location a My Targets entry was saved for. Older entries saved before
// `location_id` existed fall back to the active location, same treatment as a removed equipment.
function getMtLocation(mt) {
  const loc = mt.location_id ? getLocations().find(l => l.id === mt.location_id) : null;
  return loc || getActiveLocation();
}

function myTargetVignetteUrl(mt, eq) {
  if (!eq) return null;
  const fov = calcFOV(eq);
  const wdeg = skyViewDeg({ size_arcmin: mt.size_arcmin }, fov);
  return hipsImageUrl('CDS/P/DSS2/color', mt.ra, mt.dec, wdeg, 160, 112);
}

function renderMyTargets() {
  const items = getMyTargets();
  const el = document.getElementById('tab-plan');
  if (!items.length) {
    el.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" style="color:var(--text-dim)"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>
      <p>No targets saved yet</p>
      <p style="font-size:13px;margin-top:8px">Open a target, frame it, and tap "+ Add to My Targets"</p>
    </div>`;
    return;
  }
  sortedMtIds = items.map(m => m.id);
  const statuses = [['todo','To do'],['in_progress','In progress'],['done','Done']];
  let html = `<div class="card-header"><div class="card-title">My Targets${helpBtn('mytargets')}</div><span style="font-size:12px;color:var(--text-dim)">${items.length} saved</span></div>`;
  items.forEach(mt => {
    const eq = getEquipment().find(e => e.id === mt.equipment_id);
    const loc = getMtLocation(mt);
    const img = myTargetVignetteUrl(mt, eq);
    const data = loc ? calcBestSeasonData(mt.ra, mt.dec, loc.lat, loc.lon, loc.min_altitude) : null;
    html += `<div class="card" style="cursor:pointer" onclick="openTargetDetail(null,'${mt.id}')">
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <div style="width:160px;height:112px;flex-shrink:0;background:#0a0a18;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center">
          ${img ? `<img src="${img}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover">` : `<span style="font-size:11px;color:var(--mgn);text-align:center;padding:8px">Equipment removed</span>`}
        </div>
        <div style="flex:1;min-width:180px">
          <div class="card-title" style="margin-bottom:2px">${mt.name || mt.catalog}</div>
          <p style="font-size:12px;color:var(--text-dim);margin-bottom:6px">${mt.type} · ${eq ? eq.name : '⚠ equipment removed'} · ${mt.location_id ? (loc?.name || '⚠ site removed') : `${loc?.name||'—'} (legacy)`}</p>
          ${data ? miniBestSeasonSVG(data) : ''}
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap">
        <div class="segmented" onclick="event.stopPropagation()">${statuses.map(([k,label])=>`<button class="${mt.status===k?'active':''}" onclick="setMyTargetStatus('${mt.id}',this,'${k}')">${label}</button>`).join('')}</div>
        <button class="btn-sm btn-danger" onclick="event.stopPropagation();if(confirm('Remove this framing from My Targets?')){saveMyTargets(getMyTargets().filter(m=>m.id!=='${mt.id}'));renderMyTargets();}">Remove</button>
      </div>
    </div>`;
  });
  el.innerHTML = html;
}

// ─── Target Detail ──────────────────────────────────────────
function openTargetDetail(tid, mtId) {
  const isMt = !!mtId;
  let t, eq, loc, mt = null;

  if (isMt) {
    mt = getMyTargets().find(x => x.id === mtId);
    if (!mt) return;
    const cat = SAP_CATALOG?.find(o => o.id === mt.catalog);
    t = { id: mt.id, catalog: mt.catalog, name: mt.name, type: mt.type,
      ra: cat ? cat.ra : mt.ra, dec: cat ? cat.dec : mt.dec, // catalog position, used as the "reset to target" anchor
      size_arcmin: mt.size_arcmin, size_min_arcmin: mt.size_min_arcmin, pa: mt.pa,
      filters: mt.filters, notes: '' };
    eq = getEquipment().find(e => e.id === mt.equipment_id) || null;
    loc = getMtLocation(mt);
  } else {
    const targets = getTargets();
    t = targets.find(x=>x.id===tid);
    if (!t) return;
    eq = getListEquipment();
    loc = getListLocation();
  }
  const fov = eq ? calcFOV(eq) : {w:0,h:0,ps:0};
  window._detailMtId = isMt ? mtId : null;
  window._detailTid = isMt ? null : tid;
  window._detailEq = eq;

  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  if (isMt) {
    sortedMtIds = getMyTargets().map(m=>m.id);
  }
  const idsList = isMt ? sortedMtIds : sortedTargetIds;
  const idx = idsList.indexOf(isMt ? mtId : tid);
  const total = idsList.length;

  const nextId = idx < total-1 ? idsList[idx+1] : null;

  const backBtn = document.getElementById('detail-back-btn');

  const nextBtn = document.getElementById('detail-next-btn');
  const posEl = document.getElementById('detail-pos');
  backBtn.onclick = closeTargetDetail;
  prevBtn.onclick = prevId ? ()=>openTargetDetail(isMt?null:prevId, isMt?prevId:undefined) : null;
  prevBtn.style.opacity = prevId ? '1' : '0.3';
  prevBtn.style.pointerEvents = prevId ? 'auto' : 'none';
  nextBtn.onclick = nextId ? ()=>openTargetDetail(isMt?null:nextId, isMt?nextId:undefined) : null;
  nextBtn.style.opacity = nextId ? '1' : '0.3';
  nextBtn.style.pointerEvents = nextId ? 'auto' : 'none';
  posEl.textContent = total ? `${idx+1} / ${total}` : '';

  let html = '';
  html += `<h2 style="margin:12px 0 4px">${t.name||t.catalog}</h2>`;
  const sizeDisplay = t.size_arcmin ? `${Math.round(t.size_arcmin)}'` : t.size || 'N/A';

  const raH = Math.floor(t.ra/15), raM = Math.floor((t.ra/15-raH)*60), raS = ((t.ra/15-raH)*60-raM)*60;
  const decSign = t.dec>=0?'+':'-', decAbs = Math.abs(t.dec), decD = Math.floor(decAbs), decM = Math.floor((decAbs-decD)*60), decS = ((decAbs-decD)*60-decM)*60;
  const conName = SAP_CATALOG?.find(o=>o.id===t.catalog)?.con_full || '';
  html += `<p style="color:var(--text-dim);font-size:12px;margin-bottom:12px">RA ${raH}h ${raM}m ${raS.toFixed(0)}s · Dec ${decSign}${decD}° ${decM}' ${decS.toFixed(0)}"${conName?' · '+conName:''}</p>`;

  if (isMt) {
    const statuses = [['todo','To do'],['in_progress','In progress'],['done','Done']];
    html += `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px">
      <div class="segmented" id="mt-status-seg">${statuses.map(([k,label])=>`<button class="${mt.status===k?'active':''}" onclick="setMyTargetStatus('${mt.id}',this,'${k}')">${label}</button>`).join('')}</div>

  } else {

    ${detailWeeks.length>6?`<div style="display:flex;gap:2px">${detailWeeks.slice(6).map(w =>

        <img id="sky-frame-img" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none">
        <div id="sky-frame-msg" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-dim)"><div class="loading"></div></div>
        <svg id="sky-frame-svg" viewBox="0 0 900 600" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></svg>
      </div>
      <div class="slider-row" style="margin-top:10px"><label>Camera angle: <span id="sky-angle-val">${isMt?Math.round(mt.angle):0}</span>°</label><input type="range" min="0" max="179" value="${isMt?mt.angle:0}" style="flex:1" oninput="setSkyAngle(this.value)"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px">
        <span id="sky-center" style="font-size:12px;color:var(--text-dim)"></span>

    </div>`;

  // Altitude Profile
  if (loc && t.ra != null && t.dec != null) {
    html += `<div class="card" id="alt-profile-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">

        <button class="framing-nav framing-nav-right" onclick="navigateAltDay(1)">›</button>
        <div id="alt-chart-container"></div>

      <input type="range" min="0" max="${detailNw-1}" value="0" id="alt-chart-slider" data-maxweek="${detailNw-1}" style="width:100%;margin-top:8px"

      <div id="alt-moon-legend" style="margin-top:6px"></div>
      <p style="font-size:11px;color:var(--text-dim);margin-top:6px">- - - Dashed line shows the Moon's angular separation from the target in degrees, plotted on the same 0-90° scale as altitude — not the Moon's own altitude. Dash pattern reflects that night's moon phase: dotted = new moon, longer dashes = fuller moon, solid = full moon. Swipe (or ‹ ›) to switch between week and day-by-day view; the slider moves through weeks or days depending on the current view.</p>
    </div>`;
  }

  if (isMt) {
    html += `<div class="card" id="capture-advice-card"><div class="card-title" style="margin-bottom:6px">Capture Advice</div><div id="advice-body"></div></div>`;
  }

  // Best season + Filters side by side
  const mSens = moonSensitivity(t);
  const mLabel = {none:'Insensitive — narrowband only, shoot any moon phase',half:'Partial — mixed filters, prefer darker skies for broadband channels',full:'Sensitive — broadband, prioritize new moon'}[mSens];
  html += `<div style="display:flex;gap:12px;flex-wrap:wrap">`;
  if (loc && t.ra != null && t.dec != null) {
    html += `<div class="card" id="best-season-card" style="flex:3;min-width:250px">

        ${isMt ? `<span style="font-size:12px;color:var(--text-dim)">${mt.location_id ? (loc?.name || '⚠ site removed') : `${loc?.name||'—'} (legacy, site not fixed)`}</span>` : ''}
      </div>
      <div id="best-season-container"></div>
    </div>`;
  }
  const relatedIds = SAP_CATALOG ? (SAP_CATALOG.find(o=>o.id===t.catalog)?.related||[]) : [];
  html += `<div class="card" style="flex:2;min-width:180px"><div class="card-title" style="margin-bottom:8px">Filters</div><div>${filterBadges(t.filters)}</div>
    <p style="font-size:13px;margin-top:8px">${moonIcon(mSens,16)} ${mLabel}</p>
    ${relatedIds.length?`<div class="card-title" style="margin:14px 0 6px">Related Objects</div><p style="font-size:13px">${relatedIds.join(', ')}</p>`:''}
  </div>
  </div>`;

  if (t.notes) html += `<div class="card"><div class="card-title" style="margin-bottom:6px">Notes</div><p style="font-size:13px">${t.notes}</p></div>`;

  // Wikipedia & Simbad
  const netPrefs = getPrefs();
  const showWiki = netPrefs.wiki !== false, showSky = netPrefs.skyview !== false;
  if (showWiki) html += `<div id="wiki-section" class="card"><div class="card-title">Wikipedia</div><div class="loading" id="wiki-loading"></div></div>`;
  html += `<div id="simbad-section" class="card"><div class="card-title">Simbad</div><div class="loading" id="simbad-loading"></div></div>`;
  const aiOn = getMode() === 'assisted' && !!LS.get('sap_claude_key');
  if (aiOn) html += `<div id="ai-section" class="card"><div class="card-title" style="margin-bottom:6px">AI Description</div><div id="ai-body"></div></div>`;

  const contentEl = document.getElementById('detail-content');
  contentEl.innerHTML = `<div class="detail-content-inner">${html}</div>`;
  contentEl.scrollTop = 0;
  document.getElementById('target-detail').classList.add('open');

  if (eq && t.ra != null && t.dec != null && showSky) {
    initSkyFrame(t, fov, isMt ? { mtId: mt.id, ra: mt.ra, dec: mt.dec, angle: mt.angle } : null);
  }
  if (showWiki) fetchWiki(t);
  fetchSimbad(t);
  if (document.getElementById('ai-body')) renderAiDescription(t);
  if (isMt) renderCaptureAdvice(mt);
  window._altMode = 'week';
  window._detailLoc = loc;
  window._detailStartDate = detailStartDate;
  if (loc && t.ra != null) setTimeout(()=>{
    updateAltChart(t.ra, t.dec, loc.lat, loc.lon, detailStartDate, 0, loc.min_altitude, 3);
    renderBestSeason(t.ra, t.dec, loc.lat, loc.lon, loc.timezone||'', loc.min_altitude);
  }, 50);
}

// Re-run Altitude Profile + Best Season against the CURRENT framing center (window._sky.ra/dec),
// not the catalog position — a dragged/reframed target can genuinely be a different point in the sky.
function recalcSkyDependent() {
  const S = window._sky, loc = window._detailLoc;
  if (!S || !loc) return;
  const startDate = window._detailStartDate || todayLocal();
  updateAltChart(S.ra, S.dec, loc.lat, loc.lon, startDate, null, loc.min_altitude, null);
  renderBestSeason(S.ra, S.dec, loc.lat, loc.lon, loc.timezone||'', loc.min_altitude);
}

const MOON_TIER_GREEN = '#2ecc71', MOON_TIER_DANGER = '#8b3a3a';

// Classifies a Moon angular distance against the user's configured per-filter thresholds
// (Settings → Preferences → Moon Separation Thresholds), restricted to filters actually
// present on the target's equipment. Returns null when the feature isn't active for this
// equipment (no configured threshold matches any of its filters) — callers should fall back
// to the plain, uncolored line in that case.
function moonTierColor(moonDist, thresholds, filters) {
  if (!thresholds || !filters?.length) return null;
  const relevant = [];
  if ((filters.includes('Hα') || filters.includes('Ha')) && thresholds.Ha != null) relevant.push(['Hα', thresholds.Ha]);
  if (filters.includes('OIII') && thresholds.OIII != null) relevant.push(['OIII', thresholds.OIII]);
  if (filters.includes('SII') && thresholds.SII != null) relevant.push(['SII', thresholds.SII]);
  if (['L','R','G','B'].some(f => filters.includes(f)) && thresholds.broadband != null) relevant.push(['Broadband', thresholds.broadband]);
  if (!relevant.length) return null;
  const usable = relevant.filter(([,th]) => moonDist >= th);
  if (usable.length === relevant.length) return { color: MOON_TIER_GREEN, label: null };
  if (!usable.length) return { color: MOON_TIER_DANGER, label: null };
  const best = usable.reduce((a,b) => b[1] > a[1] ? b : a);
  return { color: best[0] === 'Broadband' ? (FILTER_COLORS.L || '#cccccc') : (FILTER_COLORS[best[0]] || '#999'), label: best[0] };
}

function updateAltChart(ra, dec, lat, lon, startDate, weekIdx, minAlt, dayIdx) {
  if (!minAlt) minAlt = getListMinAlt();
  if (weekIdx === null || weekIdx === undefined) weekIdx = window._altWeekIdx || 0;
  if (dayIdx === null || dayIdx === undefined) dayIdx = window._altDayIdx !== undefined ? window._altDayIdx : 3;
  window._altParams = {ra, dec, lat, lon, startDate, minAlt};
  window._altWeekIdx = +weekIdx;
  window._altDayIdx = dayIdx;
  const [sy,sm,sd] = startDate.split('-').map(Number);
  const weekDate = new Date(sy, sm-1, sd + weekIdx*7 + dayIdx);
  const observer = new Astronomy.Observer(lat, lon, 0);
  const raHours = ra / 15;

  const d = new Date(weekDate);
  d.setHours(12, 0, 0, 0);
  const astroDate = Astronomy.MakeTime(d);

  // Find all twilight boundaries
  let civilSet, nautSet, astroSet, astroRise, nautRise, civilRise;
  try {
    civilSet = Astronomy.SearchAltitude('Sun', observer, -1, astroDate, 1, -6);
    nautSet = Astronomy.SearchAltitude('Sun', observer, -1, astroDate, 1, -12);
    astroSet = Astronomy.SearchAltitude('Sun', observer, -1, astroDate, 1, -18);
    astroRise = Astronomy.SearchAltitude('Sun', observer, +1, astroSet, 1, -18);
    nautRise = Astronomy.SearchAltitude('Sun', observer, +1, astroSet, 1, -12);
    civilRise = Astronomy.SearchAltitude('Sun', observer, +1, astroSet, 1, -6);
  } catch { return; }
  if (!civilSet || !civilRise) return;

  const listLoc = getListLocation();
  const tz = listLoc?.timezone || undefined;
  const toLocalH = t => { try { return new Date(t).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:tz}); } catch { return new Date(t).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false}); } };

  const chartStart = civilSet.date.getTime();
  const chartEnd = civilRise.date.getTime();
  const step = 10 * 60 * 1000;
  const points = [];
  const targetVec = Astronomy.VectorFromSphere({lat:dec, lon:raHours*15, dist:1}, astroDate);
  for (let t = chartStart; t <= chartEnd; t += step) {
    const time = Astronomy.MakeTime(new Date(t));
    const hor = Astronomy.Horizon(time, observer, raHours, dec, 'normal');
    const moonEq = Astronomy.Equator('Moon', time, observer, true, true);
    const moonDist = Astronomy.AngleBetween(targetVec, Astronomy.VectorFromSphere({lat:moonEq.dec, lon:moonEq.ra*15, dist:1}, time));
    points.push({ t, alt: Math.max(hor.altitude, 0), moonDist: Math.min(moonDist, 90), label: toLocalH(t) });
  }
  const moonPhaseAngle = Astronomy.MoonPhase(astroDate);
  const moonIllumFrac = (1 - Math.cos(moonPhaseAngle * Math.PI / 180)) / 2;
  const moonColor = '#999';
  const moonPct = moonIllumFrac * 100;
  const moonDash = moonPct < 12 ? '1,4' : moonPct < 37 ? '3,3' : moonPct < 63 ? '6,3' : moonPct < 88 ? '11,3' : 'none';

  const svgW = 300, svgH = 140, padL = 30, padR = 10, padT = 10, padB = 25;
  const chartW = svgW - padL - padR, chartH = svgH - padT - padB;
  const maxAlt = 90;
  const totalTime = chartEnd - chartStart;

  const xTime = t => padL + ((t - chartStart) / totalTime) * chartW;
  const yScale = alt => padT + chartH - (alt / maxAlt) * chartH;

  let svg = `<svg width="100%" viewBox="0 0 ${svgW} ${svgH}" style="display:block">`;

  // Twilight zone backgrounds
  const zones = [
    { from: civilSet, to: nautSet, color: '#1a2540' },
    { from: nautSet, to: astroSet, color: '#111a30' },
    { from: astroSet, to: astroRise, color: '#080e1a' },
    { from: astroRise, to: nautRise, color: '#111a30' },
    { from: nautRise, to: civilRise, color: '#1a2540' },
  ];
  zones.forEach(z => {
    if (!z.from || !z.to) return;
    const x1 = xTime(z.from.date.getTime()), x2 = xTime(z.to.date.getTime());
    svg += `<rect x="${x1.toFixed(1)}" y="${padT}" width="${(x2-x1).toFixed(1)}" height="${chartH}" fill="${z.color}"/>`;
  });

  // Twilight boundary labels (top)
  if (astroSet) {
    const x = xTime(astroSet.date.getTime());
    svg += `<line x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${padT+chartH}" stroke="#334" stroke-width="0.5" stroke-dasharray="3,3"/>`;
  }
  if (astroRise) {
    const x = xTime(astroRise.date.getTime());
    svg += `<line x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${padT+chartH}" stroke="#334" stroke-width="0.5" stroke-dasharray="3,3"/>`;
  }

  // Grid lines at 20, minAlt, 55
  [20, minAlt, 55].forEach(alt => {
    const y = yScale(alt);
    const col = alt === minAlt ? '#555' : '#333';
    svg += `<line x1="${padL}" y1="${y}" x2="${svgW-padR}" y2="${y}" stroke="${col}" stroke-width="0.5" stroke-dasharray="${alt===minAlt?'4,2':'2,2'}"/>`;
    svg += `<text x="${padL-3}" y="${y+3}" fill="#666" font-size="8" text-anchor="end">${alt}°</text>`;
  });
  svg += `<line x1="${padL}" y1="${yScale(0)}" x2="${svgW-padR}" y2="${yScale(0)}" stroke="#444" stroke-width="0.5"/>`;

  // Time labels
  const labelInterval = Math.max(1, Math.floor(points.length / 6));
  for (let i = 0; i < points.length; i += labelInterval) {
    const x = xTime(points[i].t);
    svg += `<text x="${x.toFixed(1)}" y="${svgH-3}" fill="#666" font-size="8" text-anchor="middle">${points[i].label}</text>`;
  }

  // Moon angular distance curve — actual variation across the night. Dash pattern reflects moon phase.
  // Optionally colored per-segment by which filters (from the target's equipment) are still usable
  // at that Moon distance, per the user's configured thresholds (Settings → Preferences). Falls back
  // to a single plain-grey line when no threshold applies to this equipment's filters.
  const moonThresholds = getPrefs().moonThresholds;
  const moonFilters = window._detailEq?.filters;
  const tiers = points.map(p => moonTierColor(p.moonDist, moonThresholds, moonFilters));
  const moonActive = tiers.some(Boolean);
  const dashAttr = moonDash==='none' ? '' : ` stroke-dasharray="${moonDash}"`;
  if (!moonActive) {
    const moonPathD = points.map(p => `${p === points[0] ? 'M' : 'L'}${xTime(p.t).toFixed(1)},${yScale(p.moonDist).toFixed(1)}`).join('');
    svg += `<path d="${moonPathD}" fill="none" stroke="${moonColor}" stroke-width="1.5"${dashAttr} stroke-linejoin="round"/>`;
  } else {
    // One path per contiguous run of the same tier color, sharing boundary points so segments join with no gap.
    let i = 0;
    while (i < points.length) {
      const color = tiers[i].color;
      let j = i;
      let d = `M${xTime(points[i].t).toFixed(1)},${yScale(points[i].moonDist).toFixed(1)}`;
      while (j + 1 < points.length && tiers[j+1].color === color) {
        j++;
        d += ` L${xTime(points[j].t).toFixed(1)},${yScale(points[j].moonDist).toFixed(1)}`;
      }
      svg += `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.5"${dashAttr} stroke-linejoin="round"/>`;
      i = j + 1;
    }
  }

  // Start/end distance labels — flip below the line when its own value is high (near the top), regardless of what else is on the chart
  const moonStart = points[0], moonEnd = points[points.length - 1];
  const startColor = tiers[0]?.color || moonColor, endColor = tiers[tiers.length-1]?.color || moonColor;
  const startX = xTime(moonStart.t), startY = moonStart.moonDist > 75 ? yScale(moonStart.moonDist) + 12 : yScale(moonStart.moonDist) - 7;
  const endX = xTime(moonEnd.t), endY = moonEnd.moonDist > 75 ? yScale(moonEnd.moonDist) + 12 : yScale(moonEnd.moonDist) - 7;
  svg += `<text x="${(startX+14).toFixed(1)}" y="${startY.toFixed(1)}" fill="${startColor}" font-size="9" text-anchor="start">${Math.round(moonStart.moonDist)}°</text>`;
  svg += `<text x="${(endX-14).toFixed(1)}" y="${endY.toFixed(1)}" fill="${endColor}" font-size="9" text-anchor="end">${Math.round(moonEnd.moonDist)}°</text>`;

  // Altitude curve
  const pathD = points.map(p => `${p === points[0] ? 'M' : 'L'}${xTime(p.t).toFixed(1)},${yScale(p.alt).toFixed(1)}`).join('');
  svg += `<path d="${pathD}" fill="none" stroke="#4a9eff" stroke-width="2" stroke-linejoin="round"/>`;

  // Fill area above minAlt
  const yMin = yScale(minAlt);
  let fillD = '';
  let inFill = false;
  points.forEach((p, i) => {
    const x = xTime(p.t), y = yScale(p.alt);
    if (p.alt >= minAlt) {
      if (!inFill) { fillD += `M${x.toFixed(1)},${yMin} L${x.toFixed(1)},${y.toFixed(1)} `; inFill = true; }
      else fillD += `L${x.toFixed(1)},${y.toFixed(1)} `;
    } else if (inFill) {
      fillD += `L${xTime(points[i-1].t).toFixed(1)},${yMin} Z `;
      inFill = false;
    }
  });
  if (inFill) fillD += `L${xTime(points[points.length-1].t).toFixed(1)},${yMin} Z`;
  if (fillD) svg += `<path d="${fillD}" fill="#4a9eff18"/>`;

  // Max altitude marker — label flips below the dot when its own value is high (near the top), based on its value alone, not on what else is on the chart
  const maxP = points.reduce((a, b) => a.alt > b.alt ? a : b);
  const mx = xTime(maxP.t), my = yScale(maxP.alt);
  const peakLabelY = maxP.alt > 75 ? my + 14 : my - 6;
  svg += `<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="3" fill="#4a9eff"/>`;
  svg += `<text x="${mx.toFixed(1)}" y="${peakLabelY.toFixed(1)}" fill="#4a9eff" font-size="9" text-anchor="middle">${Math.round(maxP.alt)}° ${maxP.label}</text>`;

  svg += `</svg>`;

  const container = document.getElementById('alt-chart-container');
  if (container) container.innerHTML = svg;

  const legendEl = document.getElementById('alt-moon-legend');
  if (legendEl) {
    if (!moonActive) { legendEl.innerHTML = ''; }
    else {
      const dot = (color, label) => `<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text-dim)"><span style="width:9px;height:9px;border-radius:50%;background:${color};display:inline-block"></span>${label}</span>`;
      legendEl.innerHTML = `<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
        ${dot(MOON_TIER_GREEN,'All filters OK')}
        ${dot(MOON_TIER_DANGER,'None OK')}
      </div>
      <p style="font-size:11px;color:var(--text-dim);margin-top:4px">Otherwise, the line takes the color of the most demanding filter still usable — e.g. an OIII-colored segment means OIII, and anything easier, is fair game.</p>`;
    }
  }

  const mn = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const weekLabel = window._altMode === 'day'
    ? `${mn[weekDate.getMonth()]} ${weekDate.getDate()} · Day ${dayIdx+1}/7 · Moon ${Math.round(moonPct)}%`
    : `Week ${parseInt(weekIdx)+1} · ${mn[weekDate.getMonth()]} ${weekDate.getDate()} · Moon ${Math.round(moonPct)}%`;

  const label = document.getElementById('alt-chart-week-label');
  const subline = document.getElementById('alt-week-subline');
  if (window._altMode === 'day') {
    if (subline) { subline.style.display = 'block'; subline.textContent = `Week ${parseInt(weekIdx)+1}`; }
    if (label) label.textContent = weekLabel;
  } else {
    if (subline) subline.style.display = 'none';
    if (label) label.textContent = weekLabel;
  }
}

function calcBestSeasonData(ra, dec, lat, lon, minAlt) {
  if (!minAlt) minAlt = getListMinAlt();
  const observer = new Astronomy.Observer(lat, lon, 0);
  const raHours = ra / 15;
  const mn = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const year = new Date().getFullYear();
  const data = [];

  for (let m = 0; m < 12; m++) {
    const d = new Date(year, m, 15, 12, 0, 0);
    const astroDate = Astronomy.MakeTime(d);
    let sunsetAstro, sunriseAstro;
    try {
      sunsetAstro = Astronomy.SearchAltitude('Sun', observer, -1, astroDate, 1, -18);
      sunriseAstro = Astronomy.SearchAltitude('Sun', observer, +1, sunsetAstro, 1, -18);
    } catch { data.push({month: mn[m], hours: 0, maxAlt: 0}); continue; }
    if (!sunsetAstro || !sunriseAstro) { data.push({month: mn[m], hours: 0, maxAlt: 0}); continue; }

    const nightStart = sunsetAstro.date.getTime();
    const nightEnd = sunriseAstro.date.getTime();
    const step = 15 * 60 * 1000;
    let hoursAbove = 0, maxAlt = -90;
    for (let t = nightStart; t <= nightEnd; t += step) {
      const time = Astronomy.MakeTime(new Date(t));
      const hor = Astronomy.Horizon(time, observer, raHours, dec, 'normal');
      if (hor.altitude >= minAlt) hoursAbove += 0.25;
      if (hor.altitude > maxAlt) maxAlt = hor.altitude;
    }
    data.push({month: mn[m], hours: hoursAbove, maxAlt: Math.round(maxAlt)});
  }
  return data;
}

function miniBestSeasonSVG(data) {
  const maxH = Math.max(...data.map(d => d.hours), 1);
  const bestIdx = data.reduce((bi, d, i) => d.hours > data[bi].hours ? i : bi, 0);
  const svgW = 160, svgH = 46, gap = 1.5, barW = svgW / 12 - gap;
  let svg = `<svg width="100%" viewBox="0 0 ${svgW} ${svgH}" style="display:block">`;
  data.forEach((d, i) => {
    const x = i * (svgW / 12) + gap / 2;
    const barH = Math.max(1, (d.hours / maxH) * (svgH - 12));
    const y = svgH - 12 - barH;
    const color = d.hours === 0 ? '#2a3a55' : i === bestIdx ? '#2ecc71' : '#4a9eff';
    svg += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" fill="${color}" rx="1"/>`;
  });
  svg += `<text x="${(bestIdx+0.5)*(svgW/12)}" y="${svgH-2}" fill="#2ecc71" font-size="7" text-anchor="middle" font-weight="700">${data[bestIdx].month}</text>`;
  svg += `</svg>`;
  return svg;
}

function renderBestSeason(ra, dec, lat, lon, tz, minAlt) {
  if (!minAlt) minAlt = getListMinAlt();
  const data = calcBestSeasonData(ra, dec, lat, lon, minAlt);
  const maxH = Math.max(...data.map(d => d.hours), 1);
  const bestIdx = data.reduce((bi, d, i) => d.hours > data[bi].hours ? i : bi, 0);

  const svgW = 300, svgH = 150, padL = 30, padR = 10, padT = 15, padB = 25;
  const chartW = svgW - padL - padR, chartH = svgH - padT - padB;
  const barW = chartW / 12 - 3;

  let svg = `<svg width="100%" viewBox="0 0 ${svgW} ${svgH}" style="display:block;margin-top:10px;max-width:500px">`;
  // Y axis labels
  for (let h = 0; h <= maxH; h += 2) {
    const y = padT + chartH - (h / maxH) * chartH;
    svg += `<line x1="${padL}" y1="${y}" x2="${svgW-padR}" y2="${y}" stroke="#333" stroke-width="0.5" stroke-dasharray="2,2"/>`;
    svg += `<text x="${padL-3}" y="${y+3}" fill="#666" font-size="8" text-anchor="end">${h}h</text>`;
  }
  // Bars
  data.forEach((d, i) => {
    const x = padL + i * (chartW / 12) + 1.5;
    const barH = (d.hours / maxH) * chartH;
    const y = padT + chartH - barH;
    const color = i === bestIdx ? '#2ecc71' : '#4a9eff';
    svg += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" fill="${color}" rx="2"/>`;
    if (d.hours > 0) svg += `<text x="${x + barW/2}" y="${y - 3}" fill="${color}" font-size="7" text-anchor="middle">${d.hours.toFixed(1)}</text>`;
    svg += `<text x="${x + barW/2}" y="${svgH - 5}" fill="#888" font-size="8" text-anchor="middle">${d.month}</text>`;
  });
  svg += `</svg>`;

  const best = data[bestIdx];
  svg += `<p style="font-size:12px;color:var(--text-dim);text-align:center;margin-top:6px">Best: <strong style="color:#2ecc71">${best.month}</strong> — ${best.hours.toFixed(1)}h above ${minAlt}° per night, max altitude ${best.maxAlt}°</p>`;

  const container = document.getElementById('best-season-container');
  if (container) container.innerHTML = svg;
}



function onAltSliderInput(val) {
  const p = window._altParams;
  if (!p) return;
  if (window._altMode === 'day') {
    updateAltChart(p.ra, p.dec, p.lat, p.lon, p.startDate, window._altWeekIdx, p.minAlt, +val);
  } else {
    updateAltChart(p.ra, p.dec, p.lat, p.lon, p.startDate, +val, p.minAlt, 3);
  }
}

function setAltModeVisual(isDayMode) {
  const el = document.getElementById('alt-mode-badge');
  if (el) el.textContent = isDayMode ? 'DAY' : 'WEEK';
}

function altEnterDayMode() {
  const p = window._altParams;
  if (!p || window._altMode === 'day') return;
  window._altMode = 'day';
  const slider = document.getElementById('alt-chart-slider');
  if (slider) { slider.min = 0; slider.max = 6; slider.value = 0; }
  updateAltChart(p.ra, p.dec, p.lat, p.lon, p.startDate, window._altWeekIdx, p.minAlt, 0);
  setAltModeVisual(true);
}

function altExitDayMode() {
  const p = window._altParams;
  if (!p || window._altMode !== 'day') return;
  window._altMode = 'week';
  const slider = document.getElementById('alt-chart-slider');
  const maxWeek = slider?.dataset.maxweek || 11;
  if (slider) { slider.min = 0; slider.max = maxWeek; slider.value = window._altWeekIdx; }
  updateAltChart(p.ra, p.dec, p.lat, p.lon, p.startDate, window._altWeekIdx, p.minAlt, 3);
  setAltModeVisual(false);
}

function navigateAltDay(dir) {
  // Swipe/arrows only toggle between week mode and day mode (either direction flips it) — the slider (independent) handles stepping within a mode.
  if (window._altMode === 'day') altExitDayMode();
  else altEnterDayMode();
}

let _altChartTouchX = 0;
function altChartTouchStart(e) { _altChartTouchX = e.touches[0].clientX; }
function altChartTouchEnd(e) {

// Swipe left/right anywhere in the detail screen to go to the next/previous target — except

let _detailTouchX = 0, _detailTouchY = 0, _detailTouchActive = false;
function detailTouchStart(e) {
  if (e.target.closest('#alt-chart-swipe, #sky-frame-box, input[type=range]')) { _detailTouchActive = false; return; }
  _detailTouchActive = true;
  _detailTouchX = e.touches[0].clientX;
  _detailTouchY = e.touches[0].clientY;
}
function detailTouchEnd(e) {
  if (!_detailTouchActive) return;
  const dx = e.changedTouches[0].clientX - _detailTouchX;
  const dy = e.changedTouches[0].clientY - _detailTouchY;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {

}


const ASTRO_KEYWORDS = ['nebula','galaxy','star','astronomical','constellation','light-year','parsec','emission','supernova','cluster','interstellar','milky way','telescope','magnitude','right ascension','declination','hii','arc','celestial','deep sky','messier','ngc'];

function isAstroArticle(d) {
  const text = ((d.extract||'')+(d.description||'')).toLowerCase();
  return ASTRO_KEYWORDS.some(k=>text.includes(k));
}

function renderWikiResult(section, d) {
  let html = `<div class="card-title">Wikipedia</div>`;
  if (d.thumbnail?.source) html += `<img class="wiki-thumb" src="${d.thumbnail.source}" alt="${d.title}">`;
  html += `<p class="wiki-extract">${d.extract||'No description.'}</p>`;
  let url = d.content_urls?.desktop?.page || `https://en.wikipedia.org/wiki/${encodeURIComponent((d.title||'').replace(/ /g,'_'))}`;
  if (!url.startsWith('https://en.wikipedia.org/')) url = '';
  if (url) html += `<p style="font-size:12px;margin-top:8px"><a href="${url.replace(/"/g,'%22')}" target="_blank" rel="noopener" style="color:var(--accent)">Read the full article on Wikipedia ↗</a> <span style="color:var(--text-dim)">· text under CC BY-SA 4.0</span></p>`;
  section.innerHTML = html;
}

const HIPS_URL = 'https://alasky.cds.unistra.fr/hips-image-services/hips2fits';
function hipsImageUrl(hips, ra, dec, fovDeg, w, h) {
  return `${HIPS_URL}?hips=${encodeURIComponent(hips)}&width=${w}&height=${h}&fov=${fovDeg.toFixed(3)}&ra=${ra.toFixed(5)}&dec=${dec.toFixed(5)}&projection=TAN&format=jpg`;
}

function skyViewDeg(t, fov) {
  const tgt = t.size_arcmin ? t.size_arcmin / 60 : 0;
  return Math.min(10, Math.max(fov.w * 2.2, tgt * 1.6, 0.6));
}

function initSkyFrame(t, fov, mtOpts) {
  const redTypes = ['Emission Nebula', 'SNR', 'Planetary Nebula'];
  const saved = getPrefs().skySurvey?.[t.type];
  const hips = saved || (redTypes.includes(t.type) ? 'CDS/P/DSS2/red' : 'CDS/P/DSS2/color');
  const ra0 = mtOpts ? mtOpts.ra : t.ra, dec0 = mtOpts ? mtOpts.dec : t.dec, angle0 = mtOpts ? mtOpts.angle : 0;
  window._sky = { t, fov, hips, angle: angle0, ra: ra0, dec: dec0, wdeg: skyViewDeg(t, fov), token: 0, drag: null,
    mtId: mtOpts ? mtOpts.mtId : null, linesKey: mtOpts ? ('mt:' + mtOpts.mtId) : (t.catalog || t.name) };
  const box = document.getElementById('sky-frame-box');
  box.addEventListener('pointerdown', skyPointerDown);
  box.addEventListener('pointermove', skyPointerMove);
  box.addEventListener('pointerup', skyPointerUp);
  box.addEventListener('pointercancel', skyPointerUp);
  box.addEventListener('dblclick', skyDblClick);
  markSurveyBtn(hips.endsWith('/red') ? 'Red' : 'Color');
  drawSkyOverlay();
  updateSkyInfo();
  renderLinesBox();
  loadSkyFrameImage(hips.endsWith('/red'));
}

function updateSkyInfo() {
  const S = window._sky;
  if (!S) return;
  const moved = Math.abs(S.ra - S.t.ra) > 1e-6 || Math.abs(S.dec - S.t.dec) > 1e-6;
  const c = document.getElementById('sky-center');
  if (c) c.textContent = `Center: ${fmtRA(((S.ra % 360) + 360) % 360)}  ${fmtDec(S.dec)}${moved ? '' : ' (target)'}`;
  const r = document.getElementById('sky-reset');
  if (r) r.style.display = moved ? '' : 'none';
  const n = document.getElementById('sky-frame-note');
  renderLinesBox();
  if (n) n.innerHTML = `Blue rectangle = your sensor's field of view (${S.fov.w.toFixed(2)}° × ${S.fov.h.toFixed(2)}°) at true scale. Drag the image to move the framing. North is up, East is left. Image: Digitized Sky Survey (STScI/NASA), processed by CDS HiPS2FITS — <a href="https://archive.stsci.edu/dss/copyright.html" target="_blank" rel="noopener" style="color:var(--accent)">copyright &amp; credits</a>.${S.mtId ? '' : ' Double-click (mouse) or long-press (touch) anywhere on the image to see what deep-sky objects are there.'}`;
  persistMtFrame();
  recalcSkyDependent();
}

function persistMtFrame() {
  const S = window._sky;
  if (!S || !S.mtId) return;
  const arr = getMyTargets();
  const mt = arr.find(m => m.id === S.mtId);
  if (!mt) return;
  mt.ra = S.ra; mt.dec = S.dec; mt.angle = S.angle; mt.updated_at = new Date().toISOString();
  saveMyTargets(arr);
}

function loadSkyFrameImage(triedFallback, soft) {
  const S = window._sky, img = document.getElementById('sky-frame-img'), msg = document.getElementById('sky-frame-msg');
  if (!S || !img) return;
  const token = ++S.token, hips = S.hips;
  if (!soft) { msg.style.display = 'flex'; msg.innerHTML = '<div class="loading"></div>'; img.style.display = 'none'; }
  const n = new Image();
  n.onload = () => {
    if (token !== S.token) return;
    img.src = n.src; img.style.transform = ''; img.style.display = 'block'; msg.style.display = 'none';
  };
  n.onerror = () => {
    if (token !== S.token) return;
    if (hips.endsWith('/color') && !triedFallback) { S.hips = 'CDS/P/DSS2/red'; markSurveyBtn('Red'); loadSkyFrameImage(true, soft); return; }
    img.style.display = 'none'; msg.style.display = 'flex'; msg.textContent = 'Image unavailable';
  };
  n.src = hipsImageUrl(hips, S.ra, S.dec, S.wdeg, 900, 600);
}

// Inverse TAN projection: sky position of the image pixel at (px, py) from the image center (py down).
function skyOffsetToRaDec(ra0, dec0, fovDeg, px, py) {
  const k = (fovDeg / 900) * Math.PI / 180;
  const xi = -px * k, eta = -py * k;
  const rho = Math.hypot(xi, eta);
  if (rho === 0) return { ra: ra0, dec: dec0 };
  const c = Math.atan(rho), d0 = dec0 * Math.PI / 180;
  const dec = Math.asin(Math.cos(c) * Math.sin(d0) + eta * Math.sin(c) * Math.cos(d0) / rho);
  const ra = ra0 * Math.PI / 180 + Math.atan2(xi * Math.sin(c), rho * Math.cos(d0) * Math.cos(c) - eta * Math.sin(d0) * Math.sin(c));
  return { ra: ((ra * 180 / Math.PI) % 360 + 360) % 360, dec: dec * 180 / Math.PI };
}

const WIF_LONGPRESS_MS = 500, WIF_LONGPRESS_MOVE_PX = 6;

function skyPointerDown(e) {
  const S = window._sky;
  if (!S) return;
  S.drag = { x: e.clientX, y: e.clientY, dx: 0, dy: 0 };
  e.currentTarget.setPointerCapture(e.pointerId);
  e.currentTarget.style.cursor = 'grabbing';
  if (!S.mtId && e.pointerType !== 'mouse') {
    S.longPressFired = false;
    S.longPressTimer = setTimeout(() => skyLongPressFire(e.clientX, e.clientY), WIF_LONGPRESS_MS);
  }
}

function skyPointerMove(e) {
  const S = window._sky;
  if (!S?.drag) return;
  S.drag.dx = e.clientX - S.drag.x; S.drag.dy = e.clientY - S.drag.y;
  if (S.longPressTimer && (Math.abs(S.drag.dx) > WIF_LONGPRESS_MOVE_PX || Math.abs(S.drag.dy) > WIF_LONGPRESS_MOVE_PX)) {
    clearTimeout(S.longPressTimer); S.longPressTimer = null;
  }
  const img = document.getElementById('sky-frame-img');
  if (img) img.style.transform = `translate(${S.drag.dx}px, ${S.drag.dy}px)`;
}

function skyPointerUp(e) {
  const S = window._sky;
  if (!S?.drag) return;
  if (S.longPressTimer) { clearTimeout(S.longPressTimer); S.longPressTimer = null; }
  const box = document.getElementById('sky-frame-box');
  box.style.cursor = 'grab';
  if (S.longPressFired) {
    S.longPressFired = false; S.drag = null;
    const img = document.getElementById('sky-frame-img'); if (img) img.style.transform = '';
    return;
  }
  const k = box.clientWidth / 900;
  const mx = S.drag.dx / k, my = S.drag.dy / k;
  S.drag = null;
  if (Math.abs(mx) + Math.abs(my) < 4) { const img = document.getElementById('sky-frame-img'); if (img) img.style.transform = ''; return; }
  const c = skyOffsetToRaDec(S.ra, S.dec, S.wdeg, -mx, -my);
  S.ra = c.ra; S.dec = Math.max(-89.5, Math.min(89.5, c.dec));
  updateSkyInfo();
  drawSkyOverlay();
  loadSkyFrameImage(false, true);
}

// Converts a held/clicked screen point to RA/Dec and opens "What's in my Frame?" there.
function skyOpenWifAtClientPoint(clientX, clientY) {
  const S = window._sky, box = document.getElementById('sky-frame-box');
  if (!S || !box) return;
  const rect = box.getBoundingClientRect();
  const k = box.clientWidth / 900;
  const px = (clientX - rect.left - box.clientWidth / 2) / k;
  const py = (clientY - rect.top - box.clientHeight / 2) / k;
  const { ra, dec } = skyOffsetToRaDec(S.ra, S.dec, S.wdeg, px, py);
  openWhatsInFrame(ra, dec);
}

// Touch: long-press fires this. Mouse has no long-press (it would fight drag-to-pan, since holding
// the button down to drag also satisfies a long-press timer) — see skyDblClick for the mouse equivalent.
function skyLongPressFire(clientX, clientY) {
  const S = window._sky;
  if (!S) return;
  S.longPressTimer = null;
  S.longPressFired = true;
  skyOpenWifAtClientPoint(clientX, clientY);
}

// Mouse: double-click fires "What's in my Frame?" instead of long-press.
function skyDblClick(e) {
  const S = window._sky;
  if (!S || S.mtId) return;
  e.preventDefault();
  skyOpenWifAtClientPoint(e.clientX, e.clientY);
}

function resetSkyCenter() {
  const S = window._sky;
  if (!S) return;
  S.ra = S.t.ra; S.dec = S.t.dec;
  const img = document.getElementById('sky-frame-img'); if (img) img.style.transform = '';
  updateSkyInfo();
  drawSkyOverlay();
  loadSkyFrameImage();
}

function setSkyEquipment(id) {
  const S = window._sky, eq = getEquipment().find(e => e.id === id);
  if (!S || !eq) return;
  S.fov = calcFOV(eq);
  S.wdeg = skyViewDeg(S.t, S.fov);
