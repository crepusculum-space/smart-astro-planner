// ─── Emission line analysis (NSNS survey via HiPS2FITS), measured inside the current frame ───
const NSNS_BANDS = { Ha: 'simg.de/P/NSNS/DR0_2/halpha', OIII: 'simg.de/P/NSNS/DR0_2/oiii', SII: 'simg.de/P/NSNS/DR0_2/sii' };
const LINE_COLORS = { Ha: '#e74c3c', OIII: '#1abc9c', SII: '#e67e22' };
const LINE_LABELS = { Ha: 'Hα', OIII: 'OIII', SII: 'SII' };
const LINE_MIN_R = 8, LINE_PEAK_MIN_R = 25, LINE_STRONG = 0.25, LINE_WEAK = 0.10;

function getLineAnalyses() { return LS.get('sap_lines', {}); }

async function fetchFitsPixels(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const buf = await r.arrayBuffer();
  const u8 = new Uint8Array(buf);
  let off = 0, hdr = '', done = false;
  const dec = new TextDecoder('ascii');
  while (!done && off < u8.length) {
    const block = dec.decode(u8.subarray(off, off + 2880));
    off += 2880;
    for (let i = 0; i < 2880; i += 80) {
      const card = block.slice(i, i + 80);
      hdr += card + '\n';
      if (card.startsWith('END') && card.slice(3).trim() === '') { done = true; break; }
    }
  }
  if (!hdr.startsWith('SIMPLE')) throw new Error('Not a FITS file');
  const num = k => { const m = hdr.match(new RegExp('^' + k + '\\s*=\\s*([-+0-9.eE]+)', 'm')); return m ? parseFloat(m[1]) : null; };
  const bitpix = num('BITPIX'), bscale = num('BSCALE') ?? 1, bzero = num('BZERO') ?? 0;
  const w = num('NAXIS1'), h = num('NAXIS2');
  const dv = new DataView(buf, off);
  const out = new Float32Array(w * h);
  const bytes = Math.abs(bitpix) / 8;
  for (let i = 0; i < w * h; i++) {
    const o = i * bytes;
    let v = bitpix === -32 ? dv.getFloat32(o, false) : bitpix === -64 ? dv.getFloat64(o, false) : bitpix === 16 ? dv.getInt16(o, false) : dv.getInt32(o, false);
    out[i] = v * bscale + bzero;
  }
  return { w, h, data: out };
}

function frameMask(W, H, wdeg, fov, angleDeg) {
  const sc = W / wdeg, cx = W / 2, cy = H / 2, th = angleDeg * Math.PI / 180;
  const c = Math.cos(th), sn = Math.sin(th), hw = fov.w * sc / 2, hh = fov.h * sc / 2;
  const m = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
    const u = dx * c + dy * sn, v = -dx * sn + dy * c;
    if (Math.abs(u) <= hw && Math.abs(v) <= hh) m[y * W + x] = 1;
  }
  return m;
}

function recommendPalette(vals) {
  const mean = b => Math.max(0, vals[b].mean);
  const mx = Math.max(mean('Ha'), mean('OIII'), mean('SII'));
  const peak = Math.max(vals.Ha.p98 ?? 0, vals.OIII.p98 ?? 0, vals.SII.p98 ?? 0);
  if (mx < LINE_MIN_R && peak < LINE_PEAK_MIN_R) return { tiers: { Ha: 'none', OIII: 'none', SII: 'none' }, text: 'Very faint or no narrowband emission in this frame. Broadband (LRGB) is the better choice; narrowband would need very long integrations.' };
  const tiers = {};
  ['Ha', 'OIII', 'SII'].forEach(b => { const m = mean(b); tiers[b] = m < 0.5 ? 'none' : m >= LINE_STRONG * mx ? 'strong' : m >= LINE_WEAK * mx ? 'weak' : 'none'; });
  const present = ['Ha', 'OIII', 'SII'].filter(b => tiers[b] !== 'none');
  const weak = present.filter(b => tiers[b] === 'weak').map(b => LINE_LABELS[b]);
  const absent = ['Ha', 'OIII', 'SII'].filter(b => tiers[b] === 'none').map(b => LINE_LABELS[b]);
  let text;
  if (present.length === 3) text = 'SHO (Hα, OIII, SII) — all three lines carry signal.';
  else if (present.length === 2) {
    const names = present.map(b => LINE_LABELS[b]);
    text = present.includes('Ha') && present.includes('OIII') ? 'HOO bicolor (Hα + OIII).' : present.includes('Ha') ? 'Hα + SII bicolor.' : `${names.join(' + ')} bicolor.`;
  } else text = `Mostly ${LINE_LABELS[present[0]]} — a single narrowband filter, with RGB or L for star color.`;
  if (weak.length) text += ` ${weak.join(', ')} ${weak.length > 1 ? 'are' : 'is'} weak, expect long integration.`;
  if (absent.length) text += ` ${absent.join(', ')} negligible — skip ${absent.length > 1 ? 'them' : 'it'}.`;
  return { tiers, text };
}

async function analyzeFraming() {
  const S = window._sky, box = document.getElementById('lines-box');
  if (!S || !box) return;
  S.measuring = true;
  box.innerHTML = '<div class="loading"></div><p style="font-size:12px;color:var(--text-dim);text-align:center;margin-top:6px">Measuring Hα, OIII and SII in your frame…</p>';
  const W = 300, H = 200;
  const snap = { ra: S.ra, dec: S.dec, angle: S.angle, fw: S.fov.w, fh: S.fov.h, wdeg: S.wdeg };
  try {
    const mask = frameMask(W, H, snap.wdeg, S.fov, snap.angle);
    const res = await Promise.all(Object.entries(NSNS_BANDS).map(async ([b, hips]) => {
      const img = await fetchFitsPixels(hipsImageUrl(hips, snap.ra, snap.dec, snap.wdeg, W, H).replace('format=jpg', 'format=fits'));
      const vals = [];
      for (let i = 0; i < mask.length; i++) if (mask[i] && isFinite(img.data[i])) vals.push(img.data[i]);
      return [b, vals];
    }));
    const total = mask.reduce((a, v) => a + v, 0);
    const out = {};
    let minValid = 1;
    for (const [b, vals] of res) {
      minValid = Math.min(minValid, vals.length / total);
      if (!vals.length) { out[b] = { mean: 0, p90: 0, p98: 0 }; continue; }
      vals.sort((a, c) => a - c);
      out[b] = { mean: vals.reduce((a, v) => a + v, 0) / vals.length, p90: vals[Math.floor(vals.length * 0.9)], p98: vals[Math.floor(vals.length * 0.98)] };
    }
    if (minValid < 0.5) { S.measuring = false; box.innerHTML = '<p style="font-size:13px;color:var(--text-dim)">This frame is outside the coverage of the narrowband survey (northern sky), so no measurement is available.</p>'; return; }
    S.measuring = false;
    const all = getLineAnalyses();
    all[S.linesKey] = { ...snap, vals: out, date: new Date().toISOString() };
    LS.set('sap_lines', all);
    renderLinesBox();
  } catch (err) {
    S.measuring = false;
    box.innerHTML = `<p style="font-size:13px;color:var(--mgn)">Could not measure emission lines: ${String(err.message || err).replace(/</g, '&lt;')}</p><button class="btn-sm btn-secondary" onclick="analyzeFraming()">Try again</button>`;
  }
}

function renderLinesBox() {
  const S = window._sky, box = document.getElementById('lines-box');
  if (!S || !box) return;
  if (S.measuring) return;
  const a = getLineAnalyses()[S.linesKey];
  const head = '<div class="card-title" style="margin:0 0 8px">Emission Lines in Frame</div>';
  if (!a) {
    box.innerHTML = `${head}<p style="font-size:12px;color:var(--text-dim);margin-bottom:8px">Measure how much Hα, OIII and SII signal is inside your current frame, to choose between LRGB, HOO or SHO. Uses the Northern Sky Narrowband Survey.</p><button class="btn-primary btn-sm" onclick="analyzeFraming()">Analyze framing</button>`;
    return;
  }
  const same = Math.abs(a.ra - S.ra) < 1e-5 && Math.abs(a.dec - S.dec) < 1e-5 && Math.abs(a.angle - S.angle) < 0.5 && Math.abs(a.fw - S.fov.w) < 1e-3 && Math.abs(a.fh - S.fov.h) < 1e-3;
  const rec = recommendPalette(a.vals);
  const mx = Math.max(1, ...['Ha', 'OIII', 'SII'].map(b => Math.max(0, a.vals[b].mean)));
  const bars = ['Ha', 'OIII', 'SII'].map(b => {
    const m = Math.max(0, a.vals[b].mean), pct = Math.round(m / mx * 100), t = rec.tiers[b];
    const col = t === 'none' ? '#3a4a6a' : LINE_COLORS[b];
    return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px"><span style="width:38px;font-size:12px;color:var(--text-dim)">${LINE_LABELS[b]}</span><div style="flex:1;height:10px;background:#0a0a18;border-radius:5px;overflow:hidden"><div style="width:${Math.max(pct, m >= 1 ? 2 : 0)}%;height:100%;background:${col};opacity:${t === 'weak' ? .6 : 1}"></div></div><span style="width:84px;text-align:right;font-size:12px">${m >= 100 ? Math.round(m) : m.toFixed(1)} R <span style="color:var(--text-dim)">${t === 'strong' ? '' : t === 'weak' ? 'weak' : ''}</span></span></div>`;
  }).join('');
  box.innerHTML = `${head}<div style="opacity:${same ? 1 : .45}">${bars}<p style="font-size:13px;margin-top:8px">${rec.text}</p></div>
    <p style="font-size:11px;color:var(--text-dim);margin-top:6px">${same ? `Measured in this frame. R = Rayleigh, the unit of emission-line brightness (a few R is faint sky background, hundreds of R is a bright nebula).` : '⚠ The frame has changed since this measurement.'} NSNS survey, ${new Date(a.date).toLocaleDateString()}.</p>
    <button class="btn-sm btn-secondary" style="margin-top:6px" onclick="analyzeFraming()">${same ? '↻ Analyze again' : 'Analyze this framing'}</button>`;
}

function linesPromptText(catalogId) {
  const a = getLineAnalyses()[catalogId];
  if (!a) return null;
  const v = a.vals, rec = recommendPalette(v);
  const f = b => Math.max(0, v[b].mean).toFixed(v[b].mean >= 100 ? 0 : 1);
  return `Measured narrowband emission inside the planned frame (Northern Sky Narrowband Survey, mean Rayleighs): Hα ${f('Ha')}, OIII ${f('OIII')}, SII ${f('SII')}. Assessment: ${rec.text}`;
}

function markSurveyBtn(label) {
  document.querySelectorAll('#sky-survey button').forEach(b => b.classList.toggle('active', b.textContent === label));
}

function setSkySurvey(hips, btn) {
  if (!window._sky) return;
  window._sky.hips = hips;
  const pr = getPrefs();
  LS.set('sap_preferences', {...pr, skySurvey: {...(pr.skySurvey || {}), [window._sky.t.type]: hips}});

function setSkyAngle(v) {

  document.getElementById('sky-angle-val').textContent = v;

}

// Forward TAN (gnomonic) projection: image-pixel offset (900-wide space, py down) of sky position (ra,dec)
// relative to the frame center (ra0,dec0). Inverse of skyOffsetToRaDec().
function skyRaDecToOffset(ra0, dec0, fovDeg, ra, dec) {
  const k = (fovDeg / 900) * Math.PI / 180;
  const d0 = dec0 * Math.PI / 180, d = dec * Math.PI / 180, dRa = (ra - ra0) * Math.PI / 180;
  const cosC = Math.sin(d0) * Math.sin(d) + Math.cos(d0) * Math.cos(d) * Math.cos(dRa);
  const xi = Math.cos(d) * Math.sin(dRa) / cosC;
  const eta = (Math.cos(d0) * Math.sin(d) - Math.sin(d0) * Math.cos(d) * Math.cos(dRa)) / cosC;
  return { px: -xi / k, py: -eta / k };
}

// Ellipses for "What's in my Frame?" candidates, drawn in true sky orientation (not rotated by camera angle).
function wifOverlaySVG() {
  const S = window._sky;
  if (!S?.wif) return '';
  const ppd = 900 / S.wdeg, cx = 450, cy = 300;
  return S.wif.list.map((o, i) => {
    const off = skyRaDecToOffset(S.ra, S.dec, S.wdeg, o.ra, o.dec);
    const ocx = cx + off.px, ocy = cy + off.py;
    const fallback = S.wdeg * 60 * 0.03;
    const majA = o.maj || o.min || fallback, minA = o.min || o.maj || fallback;
    const rx = Math.max(4, (majA / 60 / 2) * ppd), ry = Math.max(4, (minA / 60 / 2) * ppd);
    const paRad = (o.pa || 0) * Math.PI / 180;
    const rot = Math.atan2(-Math.cos(paRad), -Math.sin(paRad)) * 180 / Math.PI;
    const sel = i === S.wif.idx;
    return `<ellipse cx="${ocx.toFixed(1)}" cy="${ocy.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" transform="rotate(${rot.toFixed(1)} ${ocx.toFixed(1)} ${ocy.toFixed(1)})" fill="${sel ? 'rgba(255,204,51,.25)' : 'rgba(255,204,51,.06)'}" stroke="#ffcc33" stroke-width="${sel ? 3 : 1.3}" stroke-dasharray="${sel ? 'none' : '4,3'}"/>`;
  }).join('');
}

function drawSkyOverlay() {
  const S = window._sky, svg = document.getElementById('sky-frame-svg');
  if (!S || !svg) return;
  const ppd = 900 / S.wdeg, w = S.fov.w * ppd, h = S.fov.h * ppd, cx = 450, cy = 300;
  svg.innerHTML = `${wifOverlaySVG()}
    <g transform="rotate(${S.angle} ${cx} ${cy})">
      <rect x="${cx-w/2}" y="${cy-h/2}" width="${w}" height="${h}" fill="rgba(74,158,255,.08)" stroke="#4a9eff" stroke-width="3"/>
    </g>
    <line x1="${cx-8}" y1="${cy}" x2="${cx+8}" y2="${cy}" stroke="#4a9eff" stroke-width="2"/><line x1="${cx}" y1="${cy-8}" x2="${cx}" y2="${cy+8}" stroke="#4a9eff" stroke-width="2"/>
    <g fill="#fff" font-size="22" font-weight="700" style="paint-order:stroke" stroke="#000" stroke-width="4">
      <text x="868" y="34" text-anchor="middle">N</text>
      <text x="30" y="34" text-anchor="middle" font-size="18">E</text>
      <text x="16" y="588" font-size="18">${S.fov.w.toFixed(2)}° × ${S.fov.h.toFixed(2)}° · view ${S.wdeg.toFixed(1)}°</text>
    </g>
    <path d="M868 48 L868 92" stroke="#fff" stroke-width="3"/>`;
}

// ─── "What's in my Frame?" — long-press/click-hold object lookup (search-result Target Detail only) ───
function angularSepArcmin(ra1, dec1, ra2, dec2) {
  const meanDecRad = (dec1 + dec2) / 2 * Math.PI / 180;
  const dRa = ((ra1 - ra2 + 540) % 360) - 180;
  const dx = dRa * Math.cos(meanDecRad) * 60, dy = (dec1 - dec2) * 60;
  return Math.hypot(dx, dy);
}

function findObjectsAtFrame(ra, dec) {
  const S = window._sky;
  if (!SAP_CATALOG || !S) return [];
  const toleranceArcmin = Math.min(5, Math.max(0.3, S.wdeg * 60 * 0.02));
  const excludeCatalog = S.t?.catalog;
  const hits = [];
  for (const o of SAP_CATALOG) {
    if (o.id === excludeCatalog) continue;
    if (Math.abs(o.dec - dec) * 60 > 600) continue;
    const sep = angularSepArcmin(ra, dec, o.ra, o.dec);
    const sizeArcmin = Math.max(o.maj || 0, o.min || 0);
    const effRadius = Math.max(sizeArcmin / 2, toleranceArcmin);
    if (sep <= effRadius) hits.push({ ...o, _size: sizeArcmin });
  }
  hits.sort((a, b) => b._size - a._size);
  return hits;
}

function openWhatsInFrame(ra, dec) {
  const S = window._sky;
  if (!S) return;
  const hits = findObjectsAtFrame(ra, dec);
  if (!hits.length) { toast('No catalog objects found at that spot'); return; }
  S.wif = { ra, dec, list: hits, idx: 0 };
  drawSkyOverlay();
  renderWifBox();
  document.getElementById('wif-box')?.scrollIntoView({ block: 'nearest' });
}

// Keeps the detail screen's ‹ › nav and "N / total" counter in sync after "What's in my Frame?"
// appends a target mid-browse, without a full re-render (would reset the Framing card's scroll/state).
function refreshTargetDetailNav() {
  if (window._detailMtId || !window._detailTid) return;
  sortedTargetIds = sortTargetsForList(getTargets()).map(t => t.id);
  const idx = sortedTargetIds.indexOf(window._detailTid);
  if (idx === -1) return;
  const total = sortedTargetIds.length;
  const prevId = idx > 0 ? sortedTargetIds[idx-1] : null;
  const nextId = idx < total-1 ? sortedTargetIds[idx+1] : null;
  const prevBtn = document.getElementById('detail-prev-btn');
  const nextBtn = document.getElementById('detail-next-btn');
  const posEl = document.getElementById('detail-pos');
  if (prevBtn) { prevBtn.onclick = prevId ? () => openTargetDetail(prevId) : null; prevBtn.style.opacity = prevId ? '1' : '0.3'; prevBtn.style.pointerEvents = prevId ? 'auto' : 'none'; }
  if (nextBtn) { nextBtn.onclick = nextId ? () => openTargetDetail(nextId) : null; nextBtn.style.opacity = nextId ? '1' : '0.3'; nextBtn.style.pointerEvents = nextId ? 'auto' : 'none'; }
  if (posEl) posEl.textContent = total ? `${idx+1} / ${total}` : '';
}

async function fetchWiki(t) {

  const names = [t.name, t.catalog].filter(Boolean);

    try {
      const r = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(name)}`);

function buildTargetInfoPrompt(t) {
  const cat = SAP_CATALOG?.find(o => o.id === t.catalog);

  const eq = window._detailEq || getListEquipment();
  const fov = eq ? calcFOV(eq) : null;
  const linesKey = window._detailMtId ? ('mt:' + window._detailMtId) : (t.catalog || t.name);
  const lines = [
    `Catalog ID: ${t.catalog || t.name}`,
    cat?.alias ? `Alias: ${cat.alias}` : null,
    `Type: ${t.type}`,
    cat?.con_full ? `Constellation: ${cat.con_full}` : null,
    `Position (J2000): RA ${fmtRA(t.ra)}, Dec ${fmtDec(t.dec)}`,
    t.size ? `Catalog angular size: ${t.size}` : null,
    cat?.related?.length ? `Nearby objects of the same type in the catalog: ${cat.related.join(', ')}` : null,
    sim?.names?.length ? `SIMBAD common name(s): ${sim.names.join(', ')}` : null,
    sim?.ids?.length ? `SIMBAD cross-identifications: ${sim.ids.join(', ')}` : null,
    sim?.facts?.filter(f => !f.startsWith('Name:')).length ? `SIMBAD data: ${sim.facts.filter(f => !f.startsWith('Name:')).join('; ')}` : null,
    linesPromptText(linesKey) ? linesPromptText(linesKey) : null,

    t.filters?.length ? `Usual filters for this type: ${t.filters.join(', ')}` : null
  ].filter(Boolean).join('\n');
  return `You are an astronomy reference assistant helping an astrophotographer plan a deep-sky target. Write a short, factual description of the object below.

${lines}

Rules:
- Plain text, no markdown, no headings, about 120 words maximum, in 2 short paragraphs.
- First line: "Common name: <name>" if the object has a widely used common name, otherwise "Common name: none widely used". Base this on the identifiers and SIMBAD data above. Catalog entries such as LBN, Sh2 or RCW often overlap objects also listed as NGC or IC, so if the cross-identifications point to a well-known named object, say so.
- Paragraph 1: what the object is, its constellation, approximate distance if you know it, and what makes it interesting.
- Paragraph 2: practical imaging advice for an astrophotographer: which filters work best, how big it appears compared with the field of view given (if any), and any difficulty (faint, low surface brightness, bright core, etc.).
- Only state what you are reasonably sure of. If you are unsure about the identity or any detail, say so plainly instead of guessing. Never invent a common name, distance or magnitude.`;
}

// ─── Capture Advice (per My Targets entry — no dates, target + equipment only) ───
function buildCaptureAdvicePrompt(mt, eq) {
  const cat = SAP_CATALOG?.find(o => o.id === mt.catalog);
  const fov = calcFOV(eq);
  const sim = window._simbad && window._simbad.catalog === mt.catalog ? window._simbad : null;
  const ln = linesPromptText('mt:' + mt.id);
  const loc = window._detailLoc;
  const lines = [
    `Catalog ID: ${mt.catalog}`,
    cat?.alias ? `Alias: ${cat.alias}` : null,
    `Type: ${mt.type}`,
    `Framing center (may differ from catalog center): RA ${fmtRA(((mt.ra%360)+360)%360)}, Dec ${fmtDec(mt.dec)}`,
    `Camera angle: ${Math.round(mt.angle)}°`,
    `Telescope: ${eq.telescope.name} (${eq.telescope.focal_length}mm f/${eq.telescope.fratio})`,
    `Camera: ${eq.sensor.name} (${eq.sensor.width_mm}×${eq.sensor.height_mm}mm)`,
    `Field of view: ${fov.w.toFixed(2)}° × ${fov.h.toFixed(2)}°`,
    `Filters available on this equipment: ${eq.filters.join(', ')}`,
    loc ? `Imaging site sky darkness: Bortle ${loc.bortle} (${loc.name})` : null,
    mt.size_arcmin ? `Catalog angular size: ${Math.round(mt.size_arcmin)}'` : null,
    sim?.facts?.length ? `SIMBAD data: ${sim.facts.join('; ')}` : null,
    ln ? ln : null
  ].filter(Boolean).join('\n');
  return `You are an astrophotography imaging assistant. Give practical capture advice for the target below, using only its properties, the site's sky darkness and the imager's equipment — no dates, no weather, no session scheduling, no total integration time (none is given).

${lines}

Rules:
- Plain text or light markdown (headings with ##, short lists, at most one small table), no more than ~200 words.
- Recommend a filter/palette strategy (e.g. LRGB, HOO, SHO, single narrowband) and justify it from the measured or usual filters above.
- If narrowband measurements are given, use them to prioritize filters and explicitly call out any filter that is negligible and can be skipped.
- Factor in the Bortle class: warn if a broadband/low-surface-brightness target will be difficult from this sky darkness, and favor narrowband over broadband in the recommendation when the Bortle class is high (skip this if no Bortle value was given).
- Give a relative integration split across filters (percentages or ratios), not absolute hours, since no total time was provided.
- Note the size of the target relative to the field of view (too large / good fit / small and could be mosaiced or cropped tighter) and any known difficulty (faint, low surface brightness, bright core needing shorter subs, tight framing needing precise polar alignment, etc.).
- State only what you are reasonably confident about; say so plainly if unsure rather than guessing.`;
}

async function fetchSimbad(t) {
  const section = document.getElementById('simbad-section');
  const name = t.catalog || t.name;
  const esc = name.replace(/'/g,"''");
  const tap = q => fetch(`https://simbad.cds.unistra.fr/simbad/sim-tap/sync?REQUEST=doQuery&LANG=ADQL&FORMAT=json&QUERY=${encodeURIComponent(q)}`).then(r => { if (!r.ok) throw new Error(); return r.json(); });
  try {
    const [idsRes, infoRes] = await Promise.all([
      tap(`SELECT ids FROM ident JOIN ids USING(oidref) WHERE id='${esc}'`),
      tap(`SELECT basic.otype_txt, basic.morph_type, allfluxes.V, basic.rvz_radvel, mesDistance.dist, mesDistance.unit FROM ident JOIN basic ON ident.oidref=basic.oid LEFT JOIN allfluxes ON allfluxes.oidref=basic.oid LEFT JOIN mesDistance ON mesDistance.oidref=basic.oid WHERE ident.id='${esc}'`).catch(() => null)
    ]);
    const prefixes = ['NGC','IC','M ','Sh2','Ced','vdB','LBN','LDN','Simeis','CTB','Abell','B '];
    const raw = idsRes.data?.[0]?.[0] || '';
    const allIds = raw.split('|').map(x=>x.trim().replace(/\s+/g,' '));
    const ids = allIds.filter(id=>prefixes.some(p=>id.startsWith(p)));
    const names = allIds.filter(id=>id.startsWith('NAME ')).map(id=>id.slice(5).trim());
    const row = infoRes?.data?.[0];
    const facts = [];
    if (names.length) facts.push(`Name: ${names.join(', ')}`);
    if (row) {
      const [otype, morph, v, rv, dist, unit] = row;
      const otypes = {HII:'HII region', ISM:'Interstellar medium', PN:'Planetary nebula', SNR:'Supernova remnant', RNe:'Reflection nebula', DNe:'Dark nebula', OpC:'Open cluster', GlC:'Globular cluster', Cl:'Cluster', Cld:'Cloud', MoC:'Molecular cloud', EmO:'Emission object', Galaxy:'Galaxy', AGN:'Active galaxy', GiG:'Galaxy', GinGroup:'Galaxy in group', LSB:'Low surface brightness galaxy', Neb:'Nebula', BiC:'Cluster of stars', As:'Association of stars'};
      if (otype) facts.push(`Type: ${otypes[otype.trim()] || otype.trim()}`);
      if (morph) facts.push(`Morphology: ${morph}`);
      if (v != null) facts.push(`Mag V ${(+v).toFixed(1)}`);
      if (dist != null) {
        const u = (unit||'').trim().toLowerCase(); const d = +dist;
        const ly = u==='pc' ? d*3.2616 : u==='kpc' ? d*3261.6 : u==='mpc' ? d*3261600 : null;
        if (ly) facts.push(`Distance: ~${ly>=1e6 ? (ly/1e6).toFixed(1)+' Mly' : Math.round(ly).toLocaleString()+' ly'}`);
      }
      if (rv != null) facts.push(`Radial velocity: ${Math.round(+rv)} km/s`);
    }
    window._simbad = { catalog: name, ids, names, facts };
    section.innerHTML = `<div class="card-title">Simbad</div>
      ${facts.length ? `<p style="font-size:13px;margin-bottom:8px">${facts.join(' · ')}</p>` : ''}
      <p style="font-size:13px;color:var(--text-dim)">${ids.length ? ids.join(', ') : 'No catalog IDs found.'}</p>`;
  } catch {
    section.innerHTML = `<div class="card-title">Simbad</div><p style="color:var(--text-dim);font-size:13px">Could not fetch Simbad data.</p>`;
  }
}

function getDuration() {
  const v = parseInt(document.getElementById('ntl-duration')?.value);
  return isNaN(v) ? 6 : Math.min(12, Math.max(1, v));
}

function updateEndLabel() {
  const v = document.getElementById('ntl-start').value;
  if (!v) return;
  const dur = getDuration();
  const endStr = calcEndDate(v, dur);
  const label = document.getElementById('ntl-end-label');
  if (label) label.textContent = `${dur} weeks · ends ${formatDateReadable(endStr)}`;
}

function segSelect(btn) {
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function buildTargetPrompt() {
  const loc = getLocations().find(l=>l.id===document.getElementById('ntl-loc').value);
  const startVal = document.getElementById('ntl-start').value;
  const [sy,sm,sd] = startVal.split('-').map(Number);
  const start = new Date(sy, sm-1, sd);
  const numWeeks = getDuration();
  const endVal = calcEndDate(startVal, numWeeks);
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const periodStr = `${formatDateReadable(startVal)} to ${formatDateReadable(endVal)} (${numWeeks} weeks)`;
  const months = [];
  const [ey,em,ed] = endVal.split('-').map(Number);
  const endDate = new Date(ey, em-1, ed-1);
  const cur = new Date(sy, sm-1, sd);
  while (cur <= endDate) {
    const mName = monthNames[cur.getMonth()];
    if (!months.includes(mName)) months.push(mName);
    cur.setMonth(cur.getMonth()+1); cur.setDate(1);
  }
  const year = sy;
  const listSize = parseInt(document.getElementById('ntl-size')?.value)||15;
  const must = document.getElementById('ntl-must').value.trim();

  const sliders = {};
  ['emission_nebula','snr','ifn','reflection_nebula','planetary_nebula','galaxy','open_cluster','globular_cluster','dark_nebula'].forEach(k=>{
    sliders[k] = parseInt(document.getElementById('ntl-'+k).value);
  });

  return { loc, start, months, year, listSize, numWeeks, sliders, must };
}

let _wakeLock = null;
async function acquireWakeLock() {
  try { if ('wakeLock' in navigator) _wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
}
function releaseWakeLock() {
  try { _wakeLock?.release(); } catch(e) {}
  _wakeLock = null;
}

async function callClaudeAPI(promptText, maxTokens) {
  const key = LS.get('sap_claude_key');
  await acquireWakeLock();
  let r;
  try {
    r = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:getClaudeModel(),max_tokens:maxTokens||16384,messages:[{role:'user',content:promptText}]})
    });
  } finally {
    releaseWakeLock();
  }
  if (!r.ok) { const e=await r.json();throw new Error(e.error?.message||r.statusText) }
  const d = await r.json();
  lastApiUsage = null;
  if (d.usage) {
    const [inRate, outRate] = modelPricePerMTok(d.model || getClaudeModel());
    const inp = d.usage.input_tokens||0, out = d.usage.output_tokens||0;
    const cost = (inp * inRate + out * outRate) / 1e6;
    lastApiUsage = { input: inp, output: out, total: inp+out, cost };
    const log = LS.get('sap_usage_log', []);
    const month = new Date().toISOString().slice(0,7);
    log.push({ month, input: inp, output: out, cost: +cost.toFixed(4) });
    LS.set('sap_usage_log', log);
  }
  const textBlock = (d.content || []).find(b => b.type === 'text');
  if (!textBlock) throw new Error(`Model returned no text (stop_reason: ${d.stop_reason || 'unknown'}) — try again or raise the token limit`);
  return textBlock.text;
}

let lastApiUsage = null;

// Approximate public per-million-token pricing by model family (USD); used only to estimate
// the cost shown in Settings → API Usage. Unknown/legacy ids fall back to Sonnet-tier pricing.
function modelPricePerMTok(modelId) {
  const id = (modelId||'').toLowerCase();
  if (id.includes('opus')) return [15, 75];
  if (id.includes('haiku')) return [0.8, 4];
  return [3, 15];
}

async function fetchAvailableModels() {
  const key = LS.get('sap_claude_key');
  if (!key) { toast('Add your API key first'); return; }
  toast('Fetching model list...');
  try {
    const r = await fetch('https://api.anthropic.com/v1/models?limit=100', {
      headers: {'x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}
    });
    if (!r.ok) throw new Error('API error');
    const d = await r.json();
    const models = (d.data||[]).map(m => ({ id: m.id, name: m.display_name || m.id }));
    if (!models.length) { toast('No models returned'); return; }
    LS.set('sap_claude_models', models);
    if (!models.some(m => m.id === LS.get('sap_claude_model'))) LS.set('sap_claude_model', models[0].id);
    renderSettings();
    toast(`${models.length} models loaded`);
  } catch (e) { toast('Failed to fetch models — check your API key'); }
}

const TYPE_DISPLAY = {
  emission_nebula:'Emission Nebula', snr:'SNR', ifn:'IFN',
  reflection_nebula:'Reflection Nebula', planetary_nebula:'Planetary Nebula',
  galaxy:'Galaxy', open_cluster:'Open Cluster', globular_cluster:'Globular Cluster',
  dark_nebula:'Dark Nebula'
};
const TYPE_FILTERS = {
  emission_nebula:['Hα','OIII','SII'], snr:['Hα','OIII','SII'],
  planetary_nebula:['Hα','OIII'], reflection_nebula:['L','R','G','B'],
  ifn:['L'], galaxy:['L','R','G','B'], open_cluster:['L','R','G','B'],
  globular_cluster:['L','R','G','B'], dark_nebula:['L','R','G','B']
};

function catalogToTarget(obj, weeklyVis) {
  const sizeArcmin = obj.maj || null;
  let sizeStr = null;
  if (sizeArcmin) {
    sizeStr = sizeArcmin >= 60 ? `${(sizeArcmin/60).toFixed(1)}°` : `${sizeArcmin.toFixed(1)}'`;
    if (obj.min) sizeStr += ` × ${obj.min >= 60 ? (obj.min/60).toFixed(1)+'°' : obj.min.toFixed(1)+"'"}`;
  }
  const t = {
    id: uuid(), catalog: obj.id, name: obj.name || obj.id,
    type: TYPE_DISPLAY[obj.type] || obj.type,
    ra: obj.ra, dec: obj.dec,
    size_arcmin: sizeArcmin, size: sizeStr,
    filters: TYPE_FILTERS[obj.type] || ['L','R','G','B'],
    notes: '', source: 'catalog', added: new Date().toISOString(),
    weeklyVis
  };
  if (obj.min) t.size_min_arcmin = obj.min;
  if (obj.pa != null) t.pa = obj.pa;
  return t;
}

function catalogSource(id) {
  if (id.startsWith('NGC ') || id.startsWith('IC ')) return 'NGC/IC';
  if (id.startsWith('Sh2-')) return 'Sharpless';
  if (id.startsWith('vdB ')) return 'vdB';
  if (id.startsWith('Ced ')) return 'Ced';
  if (id.startsWith('RCW ')) return 'RCW';
  if (id.startsWith('B ')) return 'Barnard';
  if (id.startsWith('LDN ')) return 'LDN';
  if (id.startsWith('LBN ')) return 'LBN';
  if (id.startsWith('SNR ')) return 'Green';
  if (id.startsWith('PN G')) return 'SECGPN';
  if (id.startsWith('MW ')) return 'Mandel';
  return 'other';
}

function poolCatalogCounts(pool) {
  const counts = {};
  pool.forEach(o => {
    const cat = catalogSource(o.id);
    counts[cat] = (counts[cat]||0) + 1;
  });
  return counts;
}

function diversityWeights(pool, sliders, diversity) {
  if (diversity === 0) return pool.map(o => sliders[o.type] || 0);
  const counts = poolCatalogCounts(pool);
  const factor = diversity / 10;
  return pool.map(o => {
    const catSize = counts[catalogSource(o.id)] || 1;
    return (sliders[o.type] || 0) / Math.pow(catSize, factor);
  });
}

function weightedSample(pool, sliders, count, usedIds, diversity) {
  const candidates = pool.filter(o => !usedIds.has(o._idx));
  if (!candidates.length) return [];
  const weights = diversityWeights(candidates, sliders, diversity||0);
  const totalWeight = weights.reduce((a, b) => a + b, 0);
  if (totalWeight === 0) return [];
  const result = [];
  const picked = new Set();
  for (let i = 0; i < count && picked.size < candidates.length; i++) {
    let r = Math.random() * totalWeight;
    for (let j = 0; j < candidates.length; j++) {
      if (picked.has(j)) continue;
      r -= weights[j];
      if (r <= 0) { result.push(candidates[j]); picked.add(j); break; }
    }
  }
  return result;
}

function searchCatalog(query) {
  if (!SAP_CATALOG) return [];
  const q = query.trim().toLowerCase();
  if (!q) return [];
  return SAP_CATALOG.filter(o => {
    if (o.id.toLowerCase().includes(q)) return true;
    if (o.name && o.name.toLowerCase().includes(q)) return true;
    if (o.alias) return o.alias.some(a => a.toLowerCase().includes(q));
    return false;
  });
}

function generateTargetList() {
  if (!SAP_CATALOG) { toast('Catalog still loading...'); return; }
  const bp = buildTargetPrompt();
  const { loc, listSize, numWeeks, sliders, must } = bp;
  const inSeasonOnly = document.getElementById('ntl-inseason')?.checked || false;
  const minAlt = loc.min_altitude || 35;
  const horizonSectors = loc.horizon_sectors || null;
  const minHours = parseFloat(document.getElementById('ntl-minhours')?.value)||0;
  const minWeeks = Math.min(numWeeks, Math.max(1, parseInt(document.getElementById('ntl-minweeks')?.value)||1));
  const diversity = parseInt(document.getElementById('ntl-diversity')?.value)||0;
  const startVal = bp.start ? `${bp.start.getFullYear()}-${String(bp.start.getMonth()+1).padStart(2,'0')}-${String(bp.start.getDate()).padStart(2,'0')}` : todayLocal();
  const lat = loc.lat, lon = loc.lon;

  closeModal('modal-new-targets');
  setTargetsContent('<div class="loading"></div><p style="text-align:center;color:var(--text-dim);margin-top:12px">Selecting targets...</p>');

  setTimeout(() => {
    const exempt = ['dark_nebula','ifn'];

    // Must-include
    const mustTargets = [];
    if (must) {
      must.split(',').forEach(q => {
        const matches = searchCatalog(q.trim());
        matches.forEach(obj => {
          const wv = calcWeeklyVisibility(obj.ra, obj.dec, lat, lon, startVal, numWeeks, horizonSectors, minAlt);
          mustTargets.push(catalogToTarget(obj, wv));
        });
      });
    }

    // Pre-filter by declination
    const decMin = lat - 70, decMax = lat + 70;
    const activeTypes = Object.entries(sliders).filter(([k,v]) => v > 0).map(([k]) => k);
    let pool = SAP_CATALOG.map((o,i) => ({...o, _idx:i})).filter(o =>
      o.dec >= decMin && o.dec <= decMax && activeTypes.includes(o.type)
    );

    // Exclude must-include objects
    const mustIds = new Set(mustTargets.map(t => t.catalog));
    pool = pool.filter(o => !mustIds.has(o.id));

    // Weighted sampling + visibility check
    const targets = [...mustTargets];
    const usedCatalogs = new Set(mustTargets.map(t => t.catalog));
    const usedIds = new Set();
    const need = listSize - targets.length;
    let attempts = 0;

    while (targets.length < listSize && attempts < 15) {
      const batch = weightedSample(pool, sliders, (listSize - targets.length) * 3, usedIds, diversity);
      if (!batch.length) break;
      for (const obj of batch) {
        if (targets.length >= listSize) break;
        usedIds.add(obj._idx);
        if (usedCatalogs.has(obj.id)) continue;
        const wv = calcWeeklyVisibility(obj.ra, obj.dec, lat, lon, startVal, numWeeks, horizonSectors, minAlt);
        if (!wv.some(w => w.vis !== '—')) continue;
        if (inSeasonOnly && wv.filter(w => w.vis === 'GD' || w.vis === 'EXC').length < 2) continue;
        if (minHours > 0 && wv.filter(w => w.hours >= minHours).length < minWeeks) continue;
        usedCatalogs.add(obj.id);
        targets.push(catalogToTarget(obj, wv));
      }
      attempts++;
    }

    // Save and render
    const months = bp.months;
    const year = bp.year;
    const name = `${months[0]?.slice(0,3)||''}–${months[months.length-1]?.slice(0,3)||''} ${year} · Bortle ${loc.bortle} · ${loc.name}`;
    LS.set('sap_targets', targets);
    LS.set('sap_target_meta', { name, numWeeks, period_start: startVal, location_id: loc.id, min_altitude: minAlt, generated: new Date().toISOString() });
    renderTargets();
    toast(`${targets.length} targets selected`);
  }, 20);
}


// ─── Astronomy Engine — visibility calculation ──────────────
function calcMaxAltDuringAstroNight(ra, dec, lat, lon, date) {
  const observer = new Astronomy.Observer(lat, lon, 0);
  const raHours = ra / 15;
  const d = new Date(date);
  d.setHours(12, 0, 0, 0);
  const astroDate = Astronomy.MakeTime(d);

  let sunsetAstro = null, sunriseAstro = null;
  try {
    sunsetAstro = Astronomy.SearchAltitude('Sun', observer, -1, astroDate, 1, -18);
    sunriseAstro = Astronomy.SearchAltitude('Sun', observer, +1, sunsetAstro, 1, -18);
  } catch { return -99; }
  if (!sunsetAstro || !sunriseAstro) return -99;

  let maxAlt = -90;
  const startTime = sunsetAstro.date.getTime();
  const endTime = sunriseAstro.date.getTime();
  const step = 30 * 60 * 1000;
  for (let t = startTime; t <= endTime; t += step) {
    const time = Astronomy.MakeTime(new Date(t));
    const hor = Astronomy.Horizon(time, observer, raHours, dec, 'normal');
    if (hor.altitude > maxAlt) maxAlt = hor.altitude;
  }
  return maxAlt;
}

// sectors: [N, NE, E, SE, S, SW, W, NW] booleans, null = no mask. Returns hours above minAlt (and in a visible sector) during astronomical night.
function calcUsableHours(ra, dec, lat, lon, date, sectors, minAlt) {
  const observer = new Astronomy.Observer(lat, lon, 0);
  const noon = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12, 0, 0);
  const useMask = sectors && sectors.some(s => s) && !sectors.every(s => s);
  try {
    const dusk = Astronomy.SearchAltitude('Sun', observer, -1, Astronomy.MakeTime(noon), 1, -18);
    if (!dusk) return 0;
    const dawn = Astronomy.SearchAltitude('Sun', observer, 1, dusk, 1, -18);
    if (!dawn) return 0;
    const step = 15 * 60000;
    let n = 0;
    for (let ms = dusk.date.getTime(); ms <= dawn.date.getTime(); ms += step) {
      const hor = Astronomy.Horizon(Astronomy.MakeTime(new Date(ms)), observer, ra / 15, dec, 'normal');
      if (hor.altitude < minAlt) continue;
      if (useMask && !sectors[Math.floor(((hor.azimuth + 22.5) % 360) / 45)]) continue;
      n++;
    }
    return n * 0.25;
  } catch(e) { return 0; }
}

function calcWeeklyVisibility(ra, dec, lat, lon, startDate, numWeeks, horizonSectors, minAlt) {
  const [sy,sm,sd] = startDate.split('-').map(Number);
  const mn = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const results = [];
  const alt = minAlt || 35;
  const maskOn = horizonSectors && horizonSectors.some(s => s) && !horizonSectors.every(s => s);
  for (let w = 0; w < numWeeks; w++) {
    const weekStart = new Date(sy, sm-1, sd + w*7);
    const weekMid = new Date(sy, sm-1, sd + w*7 + 3);
    const label = `${mn[weekStart.getMonth()]} ${weekStart.getDate()}`;
    const hours = calcUsableHours(ra, dec, lat, lon, weekMid, horizonSectors, alt);
    const vis = hours >= 4 ? 'EXC' : hours >= 2 ? 'GD' : hours > 0 ? 'MGN' : '—';
    results.push({label, vis, hours, horizonOk: maskOn ? hours > 0 : null, wk: w+1});
  }
  return results;
}

function getCurrentQuery() {
  const sliderKeys = ['emission_nebula','snr','ifn','reflection_nebula','planetary_nebula','galaxy','open_cluster','globular_cluster','dark_nebula'];
  const sliders = {};
  sliderKeys.forEach(k => { const el = document.getElementById('ntl-'+k); if (el) sliders[k] = parseInt(el.value); });
  return {
    location: document.getElementById('ntl-loc')?.value,
    period_start: document.getElementById('ntl-start')?.value,
    duration: getDuration(),
    sliders,
    must_include: document.getElementById('ntl-must')?.value||'',
    list_size: parseInt(document.getElementById('ntl-size')?.value)||15,
    min_hours: parseFloat(document.getElementById('ntl-minhours')?.value)||0,

  if (q.min_hours!=null) { const e=document.getElementById('ntl-minhours'); if(e) e.value=q.min_hours; }
  if (q.min_weeks!=null) { const e=document.getElementById('ntl-minweeks'); if(e) e.value=q.min_weeks; }
  updateEndLabel();
  if (q.sliders) {
    Object.entries(q.sliders).forEach(([k,v])=>{

      if(el){el.value=v;el.nextElementSibling.textContent=v;}

function renderMarkdown(md) {
  if (!md) return '';
  let html = md
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    .replace(/^---$/gm, '<hr>')
    .replace(/^- (.+)$/gm, '<li>$1</li>');

  // Wrap consecutive <li> in <ul>
  html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');

  // Tables
  html = html.replace(/((?:\|.+\|\n?)+)/g, (match) => {
    const rows = match.trim().split('\n').filter(r=>r.trim());
    if (rows.length < 2) return match;
    let table = '<table>';
    rows.forEach((row, i) => {
      if (row.match(/^\|[\s-:|]+\|$/)) return;
      const cells = row.split('|').filter(c=>c.trim()!=='');
      const tag = i===0?'th':'td';
      table += '<tr>' + cells.map(c=>`<${tag}>${c.trim()}</${tag}>`).join('') + '</tr>';
    });
    table += '</table>';
    return table;
  });

  // Filter colors
  html = html.replace(/\b(Hα|Ha)\b/g, '<span class="filter-ha">$1</span>');
  html = html.replace(/\bOIII\b/g, '<span class="filter-oiii">OIII</span>');
  html = html.replace(/\bSII\b/g, '<span class="filter-sii">SII</span>');

  // Ops notes
  html = html.replace(/^(.*(meridian flip|focus|startup).*)$/gim, '<p class="ops-note">$1</p>');

  // Wrap remaining lines in <p>
  html = html.replace(/^(?!<[hubltp]|<\/|<hr|<table|<tr|<blockquote)(.+)$/gm, '<p>$1</p>');

  return html;
}

function calcTransitTime(raHours, lon) {
  const now = new Date();
  const gst = Astronomy.SiderealTime(Astronomy.MakeTime(now)); // hours, Greenwich
  const lst = ((gst + lon / 15) % 24 + 24) % 24;
  const siderealUntil = ((raHours - lst) % 24 + 24) % 24;
  const solarUntil = siderealUntil * (365.25 / 366.25); // sidereal → solar hours
  return new Date(now.getTime() + solarUntil * 3600000);
}

function fmtRA(deg) {
  const h = deg / 15, hh = Math.floor(h), mm = Math.floor((h - hh) * 60);
  const ss = Math.round(((h - hh) * 60 - mm) * 60);
  return `${hh}h ${String(mm).padStart(2,'0')}m ${String(ss).padStart(2,'0')}s`;
}
function fmtDec(deg) {
  const sign = deg < 0 ? '−' : '+', abs = Math.abs(deg);
  const dd = Math.floor(abs), mm = Math.floor((abs - dd) * 60);
  const ss = Math.round(((abs - dd) * 60 - mm) * 60);
  return `${sign}${dd}° ${String(mm).padStart(2,'0')}' ${String(ss).padStart(2,'0')}"`;
}
function calcNightTimes(lat, lon) {
  const now = new Date();
  const noon = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12, 0, 0);
  const observer = new Astronomy.Observer(lat, lon, 0);
  const fmt = t => t ? t.date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '—';
  try {
    const nautDusk  = Astronomy.SearchAltitude('Sun', observer, -1, Astronomy.MakeTime(noon), 1, -12);
    const astroDusk = Astronomy.SearchAltitude('Sun', observer, -1, Astronomy.MakeTime(noon), 1, -18);
    const astroDawn = astroDusk ? Astronomy.SearchAltitude('Sun', observer,  1, astroDusk, 1, -18) : null;
    const nautDawn  = astroDusk ? Astronomy.SearchAltitude('Sun', observer,  1, astroDusk, 1, -12) : null;
    return { nautDusk: fmt(nautDusk), nautDawn: fmt(nautDawn), astroDusk: fmt(astroDusk), astroDawn: fmt(astroDawn) };
  } catch(e) {
    return { nautDusk:'—', nautDawn:'—', astroDusk:'—', astroDawn:'—' };
  }
}

function parseRAInput(str) {
  str = str.trim();
  // Compact HHMMSS (e.g. "005411" → 0h 54m 11s)
  if (/^\d{6}$/.test(str)) {
    const h = parseInt(str.slice(0,2)), m = parseInt(str.slice(2,4)), s = parseInt(str.slice(4,6));
    return (h + m/60 + s/3600) * 15;
  }
  if (/^[\d.]+$/.test(str)) { const v = parseFloat(str); return v > 24 ? v : v * 15; }
  const parts = str.replace(/[hmsHMS°'"]/g,' ').trim().split(/\s+/).map(Number);
  return ((parts[0]||0) + (parts[1]||0)/60 + (parts[2]||0)/3600) * 15;
}
function parseDecInput(str) {
  str = str.trim();
  // Compact ±DDMMSS (e.g. "+442136" or "442136" → +44° 21' 36")
  if (/^[+\-−]?\d{6}$/.test(str)) {
    const sign = (str.startsWith('-') || str.startsWith('−')) ? -1 : 1;
    const digits = str.replace(/^[+\-−]/, '');
    const d = parseInt(digits.slice(0,2)), m = parseInt(digits.slice(2,4)), s = parseInt(digits.slice(4,6));
    return sign * (d + m/60 + s/3600);
  }
  if (/^[+\-−]?[\d.]+$/.test(str)) return parseFloat(str.replace('−','-'));
  const sign = (str.startsWith('-') || str.startsWith('−')) ? -1 : 1;
  const parts = str.replace(/[°'"dms+\-−]/g,' ').trim().split(/\s+/).map(Number);
  return sign * ((parts[0]||0) + (parts[1]||0)/60 + (parts[2]||0)/3600);
}
function toggleDecSign() {
  const el = document.getElementById('mrd-dec-sign');
  const isPos = el.dataset.sign === '+';
  el.dataset.sign = isPos ? '-' : '+';
  el.textContent = isPos ? '−' : '+';
  const val = document.getElementById('mrd-dec')?.value || '';
  document.getElementById('mrd-dec-preview').textContent = previewDec(el.dataset.sign + val);
}
function previewRA(val) {
  const ra = parseRAInput(val);
  if (isNaN(ra) || !val.trim()) return '';
  return fmtRA(ra);
}
function previewDec(val) {
  const dec = parseDecInput(val);
  if (isNaN(dec) || !val.trim()) return '';
  return fmtDec(dec);
}

function meridianRemaining(transitDate) {
  const diffMs = transitDate - new Date();
  const totalMin = Math.round(diffMs / 60000);
  const abs = Math.abs(totalMin);
  const h = Math.floor(abs / 60), m = abs % 60;
  const str = `${totalMin >= 0 ? '+' : '−'}${h}h ${String(m).padStart(2,'0')}m`;
  const cls = totalMin > 2 ? 'future' : totalMin >= -60 ? 'recent' : 'past';
  return { str, cls, totalMin };
}

function saveMeridianTarget(editId) {
  const name = document.getElementById('mrd-name').value.trim();
  const raStr = document.getElementById('mrd-ra').value.trim();
  const decSign = document.getElementById('mrd-dec-sign')?.dataset.sign || '+';
  const decStr = decSign + document.getElementById('mrd-dec').value.trim();
  const locId = document.getElementById('mrd-loc').value;
  if (!name) { toast('Name required'); return; }
  if (!raStr || !document.getElementById('mrd-dec').value.trim()) { toast('RA and Dec required'); return; }
  const ra = parseRAInput(raStr), dec = parseDecInput(decStr);
  if (isNaN(ra) || isNaN(dec)) { toast('Invalid coordinates'); return; }
  const arr = getMeridianTargets();
  const now = new Date().toISOString();
  if (editId) {
    const idx = arr.findIndex(t => t.id === editId);
    if (idx >= 0) arr[idx] = {...arr[idx], name, ra, dec, location_id: locId, updated_at: now};
  } else {
    arr.push({id: uuid(), name, ra, dec, location_id: locId, updated_at: now});
  }
  saveMeridianTargets(arr);
  closeModal('modal-meridian');
  renderMeridian();
}

function addToMeridianFromTarget(tid, mtId) {
  const S = window._sky;
  const loc = window._detailLoc;
  // Prefer the live, possibly-dragged framing center from the Framing card — but only if it's
  // actually for this same target (the card may be hidden, or still hold a previous target's
  // state, when there's no equipment or Settings → Show Framing Simulator is off).
  const liveMatches = S && (mtId ? S.mtId === mtId : S.t?.id === tid);
  let name, ra, dec;
  if (liveMatches) {
    name = S.t.name || S.t.catalog; ra = S.ra; dec = S.dec;
  } else if (mtId) {
    const mt = getMyTargets().find(m => m.id === mtId);
    if (!mt) return;
    name = mt.name || mt.catalog; ra = mt.ra; dec = mt.dec;
  } else if (tid) {
    const t = getTargets().find(x => x.id === tid);
    if (!t) return;
    name = t.name || t.catalog; ra = t.ra; dec = t.dec;
  } else return;
  openAddMeridianModal({ name, ra, dec, location_id: loc?.id });
  switchTab('meridian', document.querySelectorAll('nav button')[4]);
}

async function fetchSensorSpecs() {
  const query = document.getElementById('eq-sensor-query').value.trim();
  if (!query) { toast('Enter a sensor model'); return; }
  const key = LS.get('sap_claude_key');
  if (!key) { toast('API key required'); return; }
  toast('Fetching sensor specs...');
  try {
    let text = (await callClaudeAPI(`Return ONLY a JSON object, no explanation, no markdown:\n{"width_mm": number, "height_mm": number, "pixel_size_um": number, "resolution_x": number, "resolution_y": number, "notes": "string"}\nSpecs for: ${query}. Use null for uncertain values.`, 512)).trim();
    if (text.startsWith('```')) text = text.replace(/```json?\n?/g,'').replace(/```$/,'').trim();
    const specs = JSON.parse(text);
    if (specs.width_mm) document.getElementById('eq-sw').value = specs.width_mm;
    if (specs.height_mm) document.getElementById('eq-sh').value = specs.height_mm;
    if (specs.pixel_size_um) document.getElementById('eq-px').value = specs.pixel_size_um;
    if (specs.resolution_x) document.getElementById('eq-rx').value = specs.resolution_x;
    if (specs.resolution_y) document.getElementById('eq-ry').value = specs.resolution_y;
    toast('Specs filled — verify before saving');
  } catch(e) { toast('Failed to fetch specs') }
}

async function fetchTelescopeSpecs() {
  const query = document.getElementById('eq-telescope-query').value.trim();
  if (!query) { toast('Enter a telescope model'); return; }
  const key = LS.get('sap_claude_key');
  if (!key) { toast('API key required'); return; }
  toast('Fetching telescope specs...');
  try {
    let text = (await callClaudeAPI(`Return ONLY a JSON object, no explanation, no markdown:\n{"focal_length": number, "aperture": number, "notes": "string"}\nFocal length and aperture in mm for this telescope/lens: ${query}. Use null for uncertain values.`, 512)).trim();
    if (text.startsWith('```')) text = text.replace(/```json?\n?/g,'').replace(/```$/,'').trim();
    const specs = JSON.parse(text);
    if (specs.focal_length) document.getElementById('eq-fl').value = specs.focal_length;
    if (specs.aperture) document.getElementById('eq-ap').value = specs.aperture;
    toast('Specs filled — verify before saving');
  } catch(e) { toast('Failed to fetch specs') }
}

function saveEquipment(editId) {
  const name = document.getElementById('eq-name').value.trim();
  if (!name) { toast('Name is required'); return; }
  const fl = parseFloat(document.getElementById('eq-fl').value);
  const ap = parseFloat(document.getElementById('eq-ap').value);
  if (!fl || !ap) { toast('Focal length and aperture required'); return; }
  const reducer = parseFloat(document.getElementById('eq-red').value) || null;
  const efl = fl * (reducer || 1);

  const obj = {
    id: editId || uuid(),
    name,
    telescope: { name:document.getElementById('eq-tname').value.trim(), focal_length:fl, aperture:ap, reducer, effective_focal_length:efl, fratio:+(efl/ap).toFixed(2) },
    sensor: {
      name:document.getElementById('eq-sname').value.trim(),
      width_mm:parseFloat(document.getElementById('eq-sw').value)||0,
      height_mm:parseFloat(document.getElementById('eq-sh').value)||0,
      pixel_size_um:parseFloat(document.getElementById('eq-px').value)||0,
      resolution_x:parseInt(document.getElementById('eq-rx').value)||0,
      resolution_y:parseInt(document.getElementById('eq-ry').value)||0
    },
    mount: { name:document.getElementById('eq-mount').value.trim() },
    controller: { name:document.getElementById('eq-ctrl').value.trim() },
    filters: document.getElementById('eq-filters').value.split(',').map(f=>f.trim()).filter(Boolean),
    updated_at: new Date().toISOString()
  };

  const eqs = getEquipment();
  const idx = eqs.findIndex(e=>e.id===obj.id);
  if (idx>=0) eqs[idx]=obj; else eqs.push(obj);
  LS.set('sap_equipment', eqs);
  if (!LS.get('sap_active_equipment')) LS.set('sap_active_equipment', obj.id);
  closeModal('modal-equipment-form');
  renderEquipment();
  toast('Equipment saved');
}

function renderLocations() {

      const sectors = loc.horizon_sectors;
      if (!sectors) return '';
      const dirs = ['N','NE','E','SE','S','SW','W','NW'];
      const cx=28, cy=28, r=20, ri=7;
      let s = '';
      dirs.forEach((d,i) => {
        const a0=(i*45-90-22.5)*Math.PI/180, a1=(i*45-90+22.5)*Math.PI/180;
        const x0o=cx+r*Math.cos(a0),y0o=cy+r*Math.sin(a0);
        const x1o=cx+r*Math.cos(a1),y1o=cy+r*Math.sin(a1);
        const x0i=cx+ri*Math.cos(a0),y0i=cy+ri*Math.sin(a0);
        const x1i=cx+ri*Math.cos(a1),y1i=cy+ri*Math.sin(a1);
        const fill = sectors[i] ? '#2a6abf' : '#1a2a3a';
        s += `<path d="M${x0i},${y0i} L${x0o},${y0o} A${r},${r} 0 0,1 ${x1o},${y1o} L${x1i},${y1i} A${ri},${ri} 0 0,0 ${x0i},${y0i}Z" fill="${fill}" stroke="#0d1b2a" stroke-width="1"/>`;
        if (sectors[i]) {
          const tx=cx+(r+7)*Math.cos((i*45-90)*Math.PI/180), ty=cy+(r+7)*Math.sin((i*45-90)*Math.PI/180);
          s += `<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle" fill="#7cc4ff" font-size="5" font-weight="700">${d}</text>`;
        }
      });
      s += `<circle cx="${cx}" cy="${cy}" r="${ri}" fill="#0d1b2a" stroke="#2a4a7a" stroke-width="1"/>`;
      return `<svg width="56" height="56" viewBox="0 0 56 56" style="flex-shrink:0">${s}</svg>`;
    })();
    html += `<div class="card eq-loc-card${isActive?' active-card':''}">
      <div class="card-header"><div class="card-title">${loc.protected?'🔒 ':''}${loc.name} ${isActive?'<span class="badge badge-active">Active</span>':''}</div></div>
      <div style="display:flex;align-items:flex-start;gap:12px">
        <div style="flex:1;min-width:0">
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
            <span class="stat-chip">📍 ${Math.abs(loc.lat)}°${loc.lat>=0?'N':'S'}, ${Math.abs(loc.lon)}°${loc.lon>=0?'E':'W'}</span>
            <span class="stat-chip">⛰ ${loc.elevation_ft}ft</span>
            <span class="stat-chip" style="background:${bortleColor(loc.bortle)};color:#000">Bortle ${loc.bortle}</span>
            <span class="stat-chip">↑ ${loc.min_altitude||35}° min</span>
          </div>
          <p style="font-size:13px;color:var(--text-dim)">${loc.description||''} · ~${loc.clear_nights_year} clear nights/yr</p>
          <div style="display:flex;gap:8px;margin-top:12px">
            ${isActive?'':`<button class="btn-sm btn-primary" onclick="setActiveLocation('${loc.id}')">Set Active</button>`}
            <button class="btn-sm btn-secondary" onclick="openLocationForm('${loc.id}')">Edit</button>
            ${locs.length>1||!isActive?`<button class="btn-sm btn-danger" onclick="deleteLocation('${loc.id}')">Delete</button>`:''}
          </div>
        </div>
        ${horizonSVG}
      </div>
    </div>`;
  });

  el.innerHTML = html;
}

function toggleHorizonSector(i) {
  const hidden = document.getElementById('loc-horizon-sectors');
  const sectors = JSON.parse(hidden.value);
  sectors[i] = !sectors[i];
  hidden.value = JSON.stringify(sectors);
  const path = document.getElementById(`loc-hs-${i}`);
  const dirs = ['N','NE','E','SE','S','SW','W','NW'];
  const cx=80, cy=80, r=60;
  if (path) path.setAttribute('fill', sectors[i] ? '#2a6abf' : '#1a2a4a');
  const texts = document.getElementById('loc-horizon-svg')?.querySelectorAll('text');
  if (texts && texts[i]) {
    texts[i].setAttribute('fill', sectors[i] ? '#fff' : '#4a6a9a');
  }
}
function setAllHorizonSectors(val) {
  const hidden = document.getElementById('loc-horizon-sectors');
  const sectors = Array(8).fill(val);
  hidden.value = JSON.stringify(sectors);
  document.querySelectorAll('[id^="loc-hs-"]').forEach((p,i) => p.setAttribute('fill', val ? '#2a6abf' : '#1a2a4a'));
  const texts = document.getElementById('loc-horizon-svg')?.querySelectorAll('text');
  if (texts) texts.forEach(t => t.setAttribute('fill', val ? '#fff' : '#4a6a9a'));
}

function useMyLocation() {
  const msg = document.getElementById('loc-gps-msg');
  const btn = document.getElementById('loc-gps-btn');
  if (!navigator.geolocation) { msg.textContent = 'Geolocation not available'; msg.style.color='var(--challenging)'; return; }
  btn.disabled = true;
  msg.textContent = 'Getting location...';
  msg.style.color = 'var(--text-dim)';
  navigator.geolocation.getCurrentPosition(
    pos => {
      document.getElementById('loc-lat').value = pos.coords.latitude.toFixed(4);
      document.getElementById('loc-lon').value = pos.coords.longitude.toFixed(4);
      msg.textContent = 'Location set';
      msg.style.color = 'var(--exc)';
      btn.disabled = false;
    },
    err => {
      const reasons = {1:'Permission denied',2:'Position unavailable',3:'Timeout'};
      msg.textContent = reasons[err.code] || 'Could not get location';
      msg.style.color = 'var(--challenging)';
      btn.disabled = false;
    },
    { enableHighAccuracy:true, timeout:10000 }
  );
}

function saveLocation(editId) {
  const name = document.getElementById('loc-name').value.trim();
  const lat = parseFloat(document.getElementById('loc-lat').value);
  const lon = parseFloat(document.getElementById('loc-lon').value);
  if (!name || isNaN(lat) || isNaN(lon)) { toast('Name, latitude, and longitude are required'); return; }

  const obj = {
    id: editId || uuid(),
    name,
    description: document.getElementById('loc-desc').value.trim(),
    lat, lon,
    elevation_ft: parseInt(document.getElementById('loc-elev').value)||0,
    timezone: document.getElementById('loc-tz').value,
    bortle: parseInt(document.getElementById('loc-bortle').value),
    clear_nights_year: parseInt(document.getElementById('loc-clear').value)||0,
    min_altitude: parseInt(document.getElementById('loc-minalt').value)||35,
    horizon_sectors: JSON.parse(document.getElementById('loc-horizon-sectors')?.value || 'null'),
    updated_at: new Date().toISOString(),
    protected: false
  };

  const locs = getLocations();
  const idx = locs.findIndex(l=>l.id===obj.id);
  if (idx>=0) locs[idx]=obj; else locs.push(obj);
  LS.set('sap_locations', locs);

async function exportBackup() {
  const now = todayLocal();
  const backup = {
    version: 2,
    exported_at: new Date().toISOString(),
    sap_locations: LS.get('sap_locations', []),
    sap_equipment: LS.get('sap_equipment', []),
    sap_meridian: LS.get('sap_meridian', []),
    sap_mytargets: LS.get('sap_mytargets', []),
    sap_saved_queries: LS.get('sap_saved_queries', []),
    sap_saved_lists: LS.get('sap_saved_lists', []),
    sap_ai_desc: LS.get('sap_ai_desc', {}),
    sap_lines: LS.get('sap_lines', {}),
    sap_preferences: LS.get('sap_preferences', {}),
    sap_mode: LS.get('sap_mode', null),
    sap_llm_provider: LS.get('sap_llm_provider', null),
    sap_claude_model: LS.get('sap_claude_model', null),
    sap_active_location: LS.get('sap_active_location', null),
    sap_active_equipment: LS.get('sap_active_equipment', null)
  };
  const json = JSON.stringify(backup, null, 2);
  const filename = `sap-backup-${now}.json`;
  if (window.showSaveFilePicker) {
    try {
      const fh = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description: 'JSON backup', accept: { 'application/json': ['.json'] } }]
      });
      const writable = await fh.createWritable();
      await writable.write(json);
      await writable.close();
      LS.set('sap_last_export', new Date().toISOString());
      toast('Backup saved');
      return;
    } catch(e) {
      if (e.name === 'AbortError') return; // user cancelled
    }
  }
  // Fallback
  const blob = new Blob([json], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
  LS.set('sap_last_export', new Date().toISOString());
  toast('Backup exported');
}

function mergeByUpdatedAt(existing, imported) {
  const map = new Map(existing.map(i => [i.id, i]));
  let added = 0, updated = 0;
  imported.forEach(item => {
    const cur = map.get(item.id);
    if (!cur) { map.set(item.id, item); added++; }
    else if (item.updated_at && (!cur.updated_at || item.updated_at > cur.updated_at)) {
      map.set(item.id, item); updated++;
    }
  });
  return { result: [...map.values()], added, updated };
}

function importBackup() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.style.cssText = 'position:fixed;top:-100px;left:-100px;opacity:0';
  document.body.appendChild(input);
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const b = JSON.parse(ev.target.result);
        if (!b.version || !b.exported_at) { toast('Invalid backup file'); return; }

        let msgs = [];

        if (Array.isArray(b.sap_locations)) {
          const { result, added, updated } = mergeByUpdatedAt(LS.get('sap_locations',[]), b.sap_locations);
          LS.set('sap_locations', result);
          if (added || updated) msgs.push(`Locations: +${added} new, ${updated} updated`);
        }
        if (Array.isArray(b.sap_equipment)) {
          const { result, added, updated } = mergeByUpdatedAt(LS.get('sap_equipment',[]), b.sap_equipment);
          LS.set('sap_equipment', result);
          if (added || updated) msgs.push(`Equipment: +${added} new, ${updated} updated`);
        }
        if (Array.isArray(b.sap_meridian)) {
          const { result, added, updated } = mergeByUpdatedAt(LS.get('sap_meridian',[]), b.sap_meridian);
          LS.set('sap_meridian', result);
          if (added || updated) msgs.push(`Night Info: +${added} new, ${updated} updated`);
        }
        if (Array.isArray(b.sap_mytargets)) {
          const { result, added, updated } = mergeByUpdatedAt(LS.get('sap_mytargets',[]), b.sap_mytargets);
          LS.set('sap_mytargets', result);
          if (added || updated) msgs.push(`My Targets: +${added} new, ${updated} updated`);
        }
        if (Array.isArray(b.sap_saved_queries)) {
          const cur = LS.get('sap_saved_queries',[]);
          const ids = new Set(cur.map(q => q.id));
          const fresh = b.sap_saved_queries.filter(q => !ids.has(q.id));
          if (fresh.length) { LS.set('sap_saved_queries', [...cur, ...fresh]); msgs.push(`Queries: +${fresh.length} new`); }
        }
        const unionById = (key, label) => {
          if (!Array.isArray(b[key])) return;
          const cur = LS.get(key, []);
          const ids = new Set(cur.map(x => x.id));
          const fresh = b[key].filter(x => !ids.has(x.id));
          if (fresh.length) { LS.set(key, [...cur, ...fresh]); msgs.push(`${label}: +${fresh.length} new`); }
        };
        unionById('sap_saved_lists', 'Saved lists');
        const newestByDate = (key, label) => {
          const inc = b[key];
          if (!inc || typeof inc !== 'object' || Array.isArray(inc)) return;
          const cur = LS.get(key, {});
          let n = 0;
          for (const [k, v] of Object.entries(inc)) {
            if (!cur[k] || (v?.date && (!cur[k].date || v.date > cur[k].date))) { cur[k] = v; n++; }
          }
          if (n) { LS.set(key, cur); msgs.push(`${label}: ${n} updated`); }
        };
        newestByDate('sap_ai_desc', 'AI descriptions');
        newestByDate('sap_lines', 'Emission analyses');
        if (b.sap_preferences) {
          const cur = LS.get('sap_preferences', {});
          LS.set('sap_preferences', { ...cur, ...b.sap_preferences, skySurvey: { ...(cur.skySurvey || {}), ...(b.sap_preferences.skySurvey || {}) } });
        }
        if (b.sap_llm_provider) LS.set('sap_llm_provider', b.sap_llm_provider);
        if (b.sap_claude_model) LS.set('sap_claude_model', b.sap_claude_model);
        if (b.sap_mode === 'assisted' && LS.get('sap_claude_key') && LS.get('sap_mode') !== 'assisted') LS.set('sap_mode', 'assisted');
        if (b.sap_active_equipment && !LS.get('sap_active_equipment') && LS.get('sap_equipment', []).some(e => e.id === b.sap_active_equipment)) LS.set('sap_active_equipment', b.sap_active_equipment);
        if (b.sap_active_location && !LS.get('sap_active_location') && LS.get('sap_locations', []).some(l => l.id === b.sap_active_location)) LS.set('sap_active_location', b.sap_active_location);

        LS.set('sap_last_import', new Date().toISOString());
        renderLocations(); renderEquipment(); renderMeridian(); renderSettings(); renderMyTargets(); renderTargets();
        toast(msgs.length ? msgs.join(' · ') : '✓ Already up to date');
      } catch(err) { toast('Failed to read backup file'); }
      if (input.parentNode) input.parentNode.removeChild(input);
    };
    reader.readAsText(file);
  };
  input.addEventListener('cancel', () => { if (input.parentNode) input.parentNode.removeChild(input); });
  input.click();
}

function renderUsageStats() {
  const log = LS.get('sap_usage_log', []);
  if (!log.length) return '<p style="font-size:13px;color:var(--text-dim)">No API calls recorded yet.</p>';
  const totalCalls = log.length;
  const totalTokens = log.reduce((s,e)=>s+e.input+e.output,0);
  const totalCost = log.reduce((s,e)=>s+e.cost,0);
  const avgCost = totalCost/totalCalls;
  const byMonth = {};
  log.forEach(e=>{ if(!byMonth[e.month]) byMonth[e.month]={calls:0,tokens:0,cost:0}; byMonth[e.month].calls++; byMonth[e.month].tokens+=e.input+e.output; byMonth[e.month].cost+=e.cost; });
  let html = `<p style="font-size:13px">Total calls: <strong>${totalCalls}</strong> · Tokens: <strong>${totalTokens.toLocaleString()}</strong> · Cost: <strong>$${totalCost.toFixed(2)}</strong> · Avg: <strong>$${avgCost.toFixed(3)}/call</strong></p>`;
  html += `<table style="width:100%;font-size:12px;margin-top:8px;border-collapse:collapse">
    <tr style="color:var(--accent)"><th style="text-align:left;padding:4px">Month</th><th style="text-align:right;padding:4px">Calls</th><th style="text-align:right;padding:4px">Tokens</th><th style="text-align:right;padding:4px">Cost</th></tr>`;
  Object.keys(byMonth).sort().reverse().forEach(m => {
    const d = byMonth[m];
    html += `<tr><td style="padding:4px">${m}</td><td style="text-align:right;padding:4px">${d.calls}</td><td style="text-align:right;padding:4px">${d.tokens.toLocaleString()}</td><td style="text-align:right;padding:4px">$${d.cost.toFixed(2)}</td></tr>`;
  });
  html += `</table>`;
  html += `<button class="btn-sm btn-danger" style="margin-top:10px" onclick="if(confirm('Clear all usage history?')){LS.set('sap_usage_log',[]);renderSettings();}">Clear usage history</button>`;
  return html;
}

async function updateImageCacheInfo() {
  const el = document.getElementById('img-cache-info');
  if (!el) return;
  if (!('caches' in window)) { el.textContent = 'Image cache: not supported'; return; }
  try {
    const cache = await caches.open('sap-images');
    const reqs = await cache.keys();
    let bytes = 0;
    for (const r of reqs) {
      const resp = await cache.match(r);
      if (resp) bytes += (await resp.arrayBuffer()).byteLength;
    }
    const size = bytes >= 1048576 ? (bytes/1048576).toFixed(1)+' MB' : Math.round(bytes/1024)+' KB';
    el.textContent = `Image cache: ${reqs.length} image${reqs.length===1?'':'s'} · ${size} (max 80)`;
  } catch { el.textContent = 'Image cache: unavailable'; }
}

async function clearImageCache() {
  try { await caches.delete('sap-images'); } catch {}
  updateImageCacheInfo();
  toast('Image cache cleared');
}

  const parts = [start.outerHTML];
  let node = start.nextElementSibling;
  while (node && node.tagName !== 'HR' && node.tagName !== 'H2') {
    parts.push(node.outerHTML);
    node = node.nextElementSibling;
  }
  return parts.join('');
}

async function openHelpPopup(sectionId) {
  const modal = document.getElementById('modal-help-popup');
  modal.innerHTML = `<div class="modal-header"><h2 class="modal-title">Help</h2><button class="modal-close" onclick="closeModal('modal-help-popup')">✕</button></div><div class="loading"></div>`;
  modal.classList.add('open'); modal.scrollTop = 0;
  try {
    const doc = await getHelpDoc();
    const html = extractHelpSection(doc, sectionId);
    modal.innerHTML = `<div class="modal-header"><h2 class="modal-title">Help</h2><button class="modal-close" onclick="closeModal('modal-help-popup')">✕</button></div><div class="help-popup-body">${html || '<p>Help section not found.</p>'}</div>`;
  } catch {
    modal.innerHTML = `<div class="modal-header"><h2 class="modal-title">Help</h2><button class="modal-close" onclick="closeModal('modal-help-popup')">✕</button></div><p style="color:var(--mgn)">Could not load help.</p>`;
  }
}

// ─── Ask AI (free-form question, grounded in the help guide + dev notes) ─────
let _devNotes = null;
async function getDevNotes() {
  if (_devNotes !== null) return _devNotes;
  try { _devNotes = await (await fetch('CLAUDE.md')).text(); } catch { _devNotes = ''; }
  return _devNotes;
}

async function getHelpPlainText() {
  const doc = await getHelpDoc();
  return doc.body.textContent.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
}

async function buildAskAiPrompt(question) {
  const [helpText, devNotes] = await Promise.all([getHelpPlainText(), getDevNotes()]);
  return `You are a support assistant built into Smart Astro Planner (SAP), answering this user's question about how to use the app. Answer only from the reference material below — if it isn't covered there, say so plainly rather than guessing or reaching for outside knowledge. Match the plain, beginner-friendly tone of the app's own help guide below; only bring up internal implementation details from the developer notes if truly relevant to the question, not as jargon for its own sake. Plain text or light markdown, concise.

=== App Help Guide (user-facing) ===
${helpText}

=== Developer Notes (internal architecture/rationale — background only) ===
${devNotes}

=== User's question ===
${question}`;
}

function openAskAi() {
  const modal = document.getElementById('modal-ask-ai');
  modal.innerHTML = `<div class="modal-header"><h2 class="modal-title">Ask AI</h2><button class="modal-close" onclick="closeModal('modal-ask-ai')">✕</button></div>
    <p style="font-size:13px;color:var(--text-dim);margin-bottom:10px">Ask anything about how to use Smart Astro Planner — answered from its own help guide, not the open internet.</p>
    <div class="form-group"><textarea id="ask-ai-q" rows="3" placeholder="e.g. How do I prioritize narrowband targets on full moon nights?" style="font-size:16px"></textarea></div>
    <button class="btn-primary btn-sm" onclick="submitAskAi()">${getMode()==='assisted' ? '✨ Ask' : 'Generate Prompt'}</button>
    <div id="ask-ai-answer" style="margin-top:14px"></div>`;
  modal.classList.add('open'); modal.scrollTop = 0;
}

async function submitAskAi() {
  const q = document.getElementById('ask-ai-q').value.trim();
  if (!q) { toast('Type a question first'); return; }
  const answerEl = document.getElementById('ask-ai-answer');
  if (getMode() === 'assisted') {
    if (!LS.get('sap_claude_key')) { toast('Add your API key in Settings first'); return; }
    answerEl.innerHTML = '<div class="loading"></div>';
    try {
      const prompt = await buildAskAiPrompt(q);
      const text = (await callClaudeAPI(prompt, 1024)).trim();
      answerEl.innerHTML = `<div class="plan-content" style="font-size:13px">${renderMarkdown(text)}</div>${usageLine()}`;
    } catch (err) {
      answerEl.innerHTML = `<p style="font-size:13px;color:var(--mgn)">Could not get an answer: ${String(err.message||err).replace(/</g,'&lt;')}</p>`;
    }
  } else {
    const prompt = await buildAskAiPrompt(q);
    const provider = LS.get('sap_llm_provider','claude');
    const isClaude = provider !== 'other';
    const modal = document.getElementById('modal-copy-paste');
    modal.innerHTML = `<div class="modal-header">
      <h2 class="modal-title">Ask AI</h2>
      <button class="modal-close" onclick="closeModal('modal-copy-paste')">✕</button>
    </div>
    <p style="color:var(--text-dim);margin-bottom:12px">${isClaude ? 'Copy the prompt below, paste it into Claude, then paste the response.' : 'Copy the prompt below and paste it into your preferred AI.'}</p>
    <div class="form-group"><label>Prompt</label><textarea id="cp-prompt" rows="6" readonly style="font-size:13px">${prompt.replace(/</g,'&lt;')}</textarea></div>
    <button class="btn-${isClaude?'secondary':'primary'}" id="cp-copy-btn" style="margin-bottom:16px;${isClaude?'':'width:100%'}">Copy prompt</button>
    ${isClaude?`<div class="form-group"><label>Paste the response here</label><textarea id="cp-response" rows="8" placeholder="Paste the response..."></textarea></div>
    <button class="btn-primary" style="width:100%" onclick="showAskAiPasteResponse()">Show response</button>`:''}`;
    document.getElementById('cp-copy-btn').onclick = () => {
      navigator.clipboard.writeText(document.getElementById('cp-prompt').value);
      toast('Copied!');
      if (!isClaude) closeModal('modal-copy-paste');
    };
    modal.classList.add('open'); modal.scrollTop = 0;
    closeModal('modal-ask-ai');
  }
}

function showAskAiPasteResponse() {
  const text = document.getElementById('cp-response').value.trim();
  if (!text) { toast('Paste the response first'); return; }
  closeModal('modal-copy-paste');
  const modal = document.getElementById('modal-ask-ai');
  modal.innerHTML = `<div class="modal-header"><h2 class="modal-title">Ask AI</h2><button class="modal-close" onclick="closeModal('modal-ask-ai')">✕</button></div><div class="plan-content" style="font-size:13px">${renderMarkdown(text)}</div>`;
  modal.classList.add('open');
}

// ─── Init ───────────────────────────────────────────────────
document.body.setAttribute('data-date', new Date().toLocaleDateString());
renderTargets();

// Service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
